{ id: '7.1', t: 'Devoir 2024-2025, questions 1 et 2', h: `
<p>Réponds d’abord sur une feuille, puis vérifie ici. Les réponses viennent du résumé de cours ; le dossier ne contient pas de corrigé officiel.</p>
<h4>Question 1 — Répondez aux questions suivantes</h4>
<div data-lab="rappel"><p>1. Dans quelle dimension du management le manager définit-il les objectifs de l’entreprise ?</p>
<ul><li>La planification|planif</li></ul><div class="sol">Dans la <b>planification</b>.</div></div>
<div data-lab="rappel"><p>2. Quels sont les rôles informationnels d’un manager ?</p>
<ul><li>Observateur actif|observat</li><li>Diffuseur d’information|diffus</li><li>Porte-parole|porte</li></ul><div class="sol">Observateur actif, diffuseur d’information, porte-parole.</div></div>
<div data-lab="rappel"><p>3. Qui prend les décisions stratégiques et pour quelles raisons ? (deux idées)</p>
<ul><li>La direction générale|direction|directeur|dirigeant</li><li>Elles engagent l’avenir de l’entreprise|avenir|politique|orientation|survie</li></ul><div class="sol">La <b>direction générale</b>, parce que ces décisions <b>engagent l’avenir de l’entreprise</b> : elles fixent les objectifs de politique générale, les activités et les marchés.</div></div>
<div data-lab="rappel"><p>4. Quels sont les domaines du management ?</p>
<ul><li>Management des personnes|personne</li><li>Management des moyens|moyen</li></ul><div class="sol">Le management des personnes et le management des moyens.</div></div>
<div data-lab="rappel"><p>5. Quelle décision prend le décideur lorsqu’il connaît les probabilités de chaque alternative ?</p>
<ul><li>Décision en avenir aléatoire|aleatoire</li></ul><div class="sol">Une décision en <b>avenir aléatoire</b>.</div></div>
<div data-lab="rappel"><p>6. Quel horizon de management prend en charge le suivi des capacités de production au quotidien ?</p>
<ul><li>L’horizon opérationnel|operationnel</li></ul><div class="sol">L’horizon <b>opérationnel</b>.</div></div>
<h4>Question 2 — Complétez les phrases suivantes</h4>
<div data-lab="rappel"><p>1. Quand le manager encourage les initiatives dans la prise de décision, il aura probablement un mode de management …</p>
<ul><li>participatif|participati</li></ul><div class="sol">Participatif.</div></div>
<div data-lab="rappel"><p>2. La décision répond à l’apparition … C’est une divergence entre un état … et un état …</p>
<ul><li>d’un problème|problem</li><li>actuel|actuel</li><li>souhaité|souhait</li></ul><div class="sol">D’un problème · actuel · souhaité.</div></div>
<div data-lab="rappel"><p>3. Quand vous cherchez à trouver les éléments positifs du changement et des moyens visant à aider son implantation, vous êtes en réaction de … avec ce changement.</p>
<ul><li>exploration|explor</li></ul><div class="sol">Exploration : c’est la définition mot pour mot de la diapositive « Exploration ».</div></div>
<div data-lab="rappel"><p>4. Dans le processus de décision, l’étape de décision fait suite à l’étape …</p>
<ul><li>de choix|choix</li></ul><div class="sol">De choix.</div></div>
<div data-lab="rappel"><p>5. Piloter une entreprise, c’est lui assigner … hiérarchisés, cohérents, avec des échéances, et mettre en œuvre … permettant de les atteindre.</p>
<ul><li>des objectifs|objectif</li><li>les moyens|moyen</li></ul><div class="sol">Des objectifs · les moyens.</div></div>` },

{ id: '7.3', t: 'Sujet blanc', h: `
<p>Même forme que le devoir, sur les points qui ne sont <b>pas tombés en 2024</b>. Ce sujet est une proposition, pas un sujet du professeur. Compte 30 minutes, par écrit.</p>
<h4>Question 1 — Répondez aux questions suivantes</h4>
<div data-lab="rappel"><p>1. Quelles sont les trois étapes de la démarche managériale ?</p>
<ul><li>La fixation des objectifs|objectif</li><li>La mobilisation des ressources|ressource|mobilis</li><li>L’évaluation des résultats|evaluation|resultat</li></ul><div class="sol">Fixer les objectifs, mobiliser les ressources humaines, matérielles et financières, évaluer les résultats.</div></div>
<div data-lab="rappel"><p>2. Quels sont les rôles interpersonnels d’un manager ?</p>
<ul><li>Figure de proue|proue|figure</li><li>Leader|leader</li><li>Agent de liaison|liaison</li></ul><div class="sol">Figure de proue, leader, agent de liaison.</div></div>
<div data-lab="rappel"><p>3. Quel type de décision concerne la structure de l’entreprise et l’acquisition de ses ressources ?</p>
<ul><li>Les décisions administratives|administrati</li></ul><div class="sol">Les décisions administratives.</div></div>
<div data-lab="rappel"><p>4. Dans quelle phase du processus de décision compare-t-on les résultats obtenus à ceux anticipés ?</p>
<ul><li>La phase de contrôle|control</li></ul><div class="sol">La phase de contrôle, la cinquième.</div></div>
<div data-lab="rappel"><p>5. Qui mène le management stratégique, et dans quel but ?</p>
<ul><li>La direction générale|direction</li><li>Assurer la survie et le développement de l’entreprise|survie|developpement</li></ul><div class="sol">La direction générale, pour assurer la survie et le développement de l’entreprise dans un environnement changeant.</div></div>
<div data-lab="rappel"><p>6. Quelles sont les quatre situations de décision, par incertitude croissante ?</p>
<ul><li>Avenir certain|certain</li><li>Avenir aléatoire|aleatoire</li><li>Avenir incertain|incertain</li><li>Situation conflictuelle|conflict</li></ul><div class="sol">Certain, aléatoire, incertain, conflictuelle.</div></div>
<h4>Question 2 — Complétez les phrases suivantes</h4>
<div data-lab="rappel"><p>1. Le leadership définit la … d’un individu à mener ou conduire d’autres individus dans le but d’atteindre certains …</p>
<ul><li>capacité|capacit</li><li>objectifs|objectif</li></ul><div class="sol">Capacité · objectifs.</div></div>
<div data-lab="rappel"><p>2. Tout changement est un processus : entre l’état de … et l’état d’…, il y a un chemin à parcourir.</p>
<ul><li>départ|depart</li><li>arrivée|arrive</li></ul><div class="sol">Départ · arrivée.</div></div>
<div data-lab="rappel"><p>3. Les compétences associées à un emploi, que l’entreprise estime indispensables pour la personne occupant le poste, sont les compétences …</p>
<ul><li>requises|requis</li></ul><div class="sol">Requises.</div></div>
<div data-lab="rappel"><p>4. La phase d’… est la phase de perception, de compréhension du problème.</p>
<ul><li>intelligence|intelligence</li></ul><div class="sol">Intelligence.</div></div>
<div data-lab="rappel"><p>5. Le management est l’art de gérer des … limitées de la manière la plus … pour réaliser des objectifs.</p>
<ul><li>ressources|ressource</li><li>performante|performan</li></ul><div class="sol">Ressources · performante.</div></div>
<h4>Question 3 — Quelles sont les étapes du modèle de Kotter ?</h4>
<div data-lab="ordre"><p>Écris-les sur ta feuille, puis remets-les dans l’ordre ici.</p>
<ol><li>Créer l’urgence</li><li>Former une coalition</li><li>Développer une vision</li><li>Communiquer la vision</li><li>Inciter à l’action</li><li>Démontrer les résultats à court terme</li><li>Bâtir sur les premiers résultats</li><li>Ancrer les nouvelles pratiques dans la culture</li></ol>
<div class="sol">Huit étapes, de l’urgence à l’ancrage.</div></div>
<h4>Question 4 — Complétez le tableau</h4>
<p>Pour les compétences <b>stratégiques</b> puis <b>environnementales</b> : la définition et ce qui les compose ou qui les détient.</p>
<div data-lab="rappel"><p>Compétences stratégiques : de quels quatre facteurs sont-elles composées ?</p>
<ul><li>Les savoirs|savoir</li><li>Les systèmes techniques|techni</li><li>Les systèmes de management|management|manager</li><li>Les valeurs et normes|valeur|norme|culture</li></ul>
<div class="sol">Définition : compétences clés de l’entreprise dans son ensemble, source d’un avantage concurrentiel soutenable. Facteurs : savoirs, systèmes techniques, systèmes de management, valeurs et normes.</div></div>
<div data-lab="rappel"><p>Compétences environnementales : cite trois acteurs qui les détiennent.</p>
<ul><li>Les fournisseurs|fournisseur</li><li>Les clients|client</li><li>Les laboratoires de recherche|laborat|recherche</li></ul>
<div class="sol">Définition : compétences détenues par des acteurs hors du contrôle direct de l’entreprise. Exemples : fournisseurs, clients, laboratoires de recherche.</div></div>` },

{ id: '8.2', t: 'Le management', h: `<div class="enon" data-t="1 · définitions"><p>Définir le management. Compléter : « Piloter une entreprise, c’est lui assigner … hiérarchisés, cohérents, avec des échéances, et mettre en œuvre … permettant de les atteindre. »</p></div>
<div class="cor">Ensemble des <b>techniques d’organisation</b> pour l’administration d’une entreprise ; l’<b>art de gérer des ressources limitées</b> de la manière <b>la plus performante</b> pour réaliser des <b>objectifs</b> fixés (« transformer la contrainte en performance »). Piloter : des <b>objectifs</b> … les <b>moyens</b>.</div>
<div class="enon" data-t="2 · horizons, volets, démarche, dimensions, modes"><p>Citer les deux horizons, les deux volets (domaines), les trois étapes de la démarche, les quatre dimensions et les quatre modes. Quel horizon suit la production au quotidien ? Dans quelle dimension fixe-t-on les objectifs ?</p></div>
<div class="cor"><div class="tw"><table><tbody><tr><th>Horizons</th><td><b>stratégique</b> (direction générale, survie et développement dans un environnement changeant) · <b>opérationnel</b> (décisions quotidiennes)</td></tr><tr><th>Volets / domaines</th><td>management des <b>personnes</b> · des <b>moyens</b></td></tr><tr><th>Démarche</th><td>fixer les <b>objectifs</b> → mobiliser les <b>ressources</b> (humaines, matérielles, financières) → <b>évaluer</b> les résultats</td></tr><tr><th>Dimensions</th><td><b>planification · organisation · direction · contrôle</b></td></tr><tr><th>Modes</th><td><b>directif · persuasif · participatif · délégatif</b></td></tr></tbody></table></div>Quotidien → <b>opérationnel</b>. Objectifs → <b>planification</b>. Encourager les initiatives → <b>participatif</b>.</div>
<div class="enon" data-t="3 · management moderne et situationnel"><p>Quelles dimensions le management moderne concilie-t-il ? Existe-t-il un style idéal ? De quoi dépend le choix du style ?</p></div>
<div class="cor"><figure class="fig"><svg width="380" height="226" viewBox="0 0 380 226" role="img" aria-label="Le management moderne concilie trois dimensions pour assurer la pérennité de l’organisation."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><circle cx="150" cy="80" r="68" style="fill:var(--red);opacity:.18;stroke:var(--red);stroke-width:2"/><circle cx="230" cy="80" r="68" style="fill:var(--grn);opacity:.18;stroke:var(--grn);stroke-width:2"/><circle cx="190" cy="148" r="68" style="fill:var(--amb);opacity:.18;stroke:var(--amb);stroke-width:2"/><text x="112" y="62" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Performance</text><text x="112" y="76" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">économique</text><text x="268" y="62" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Performance</text><text x="268" y="76" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">humaine</text><text x="190" y="182" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Capacité</text><text x="190" y="196" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">d’adaptation</text><text x="190" y="108" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--acc)">Management</text><text x="190" y="121" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--acc)">moderne</text></svg><figcaption>Le management moderne concilie trois dimensions pour assurer la pérennité de l’organisation.</figcaption></figure>Performance <b>économique</b>, performance <b>humaine</b>, <b>capacité d’adaptation</b> → pérennité. <b>Pas de style idéal</b> : on adopte l’attitude que commande la situation, selon les <b>types de collaborateurs</b> (leur autonomie) et les <b>caractéristiques du contexte et du problème</b>. C’est au manager de s’adapter.</div>
` },
{ id: '8.3', t: 'Le manager', h: `<div class="enon" data-t="4 · qui est-il ?"><p>Définir le manager. Pourquoi parle-t-on d’interface à double sens ? Devant qui est-il responsable ? Quels sont ses deux leviers d’influence et ses huit tâches ?</p></div>
<div class="cor"><figure class="fig"><svg width="460" height="210" viewBox="0 0 460 210" role="img" aria-label="L’interface à double sens : le manager fait le pont entre les objectifs et l’équipe, et agit par deux leviers."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><rect x="110" y="8" width="200" height="34" rx="6" style="fill:var(--acc);stroke:none"/><text x="210" y="25" text-anchor="middle" dominant-baseline="central" style="font:700 12px var(--sans);fill:var(--card)">Objectifs de l’entreprise</text><circle cx="210" cy="104" r="34" style="fill:var(--amb-soft);stroke:var(--amb);stroke-width:2"/><text x="210" y="104" text-anchor="middle" dominant-baseline="central" style="font:700 12px var(--sans);fill:var(--ink)">Manager</text><rect x="110" y="166" width="200" height="34" rx="6" style="fill:var(--panel);stroke:var(--line)"/><text x="210" y="183" text-anchor="middle" dominant-baseline="central" style="font:700 12px var(--sans);fill:var(--ink)">L’équipe et l’exécution</text><line x1="195" y1="44" x2="195" y2="68" style="stroke:var(--mut);stroke-width:1.3" marker-end="url(#fl)"/><line x1="225" y1="68" x2="225" y2="44" style="stroke:var(--mut);stroke-width:1.3" marker-end="url(#fl)"/><line x1="195" y1="140" x2="195" y2="164" style="stroke:var(--mut);stroke-width:1.3" marker-end="url(#fl)"/><line x1="225" y1="164" x2="225" y2="140" style="stroke:var(--mut);stroke-width:1.3" marker-end="url(#fl)"/><text x="330" y="58" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">il transmet la stratégie</text><text x="330" y="72" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">et les impératifs</text><text x="330" y="140" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">il fait remonter</text><text x="330" y="154" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">la bonne marche</text><text x="30" y="104" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--acc)">stimuler</text><text x="30" y="120" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--acc)">intervenir</text></svg><figcaption>L’interface à double sens : le manager fait le pont entre les objectifs et l’équipe, et agit par deux leviers.</figcaption></figure>Un <b>responsable d’équipe</b> chargé de <b>coordonner, organiser, répartir les missions et vérifier le travail</b>. Il fait le pont entre les objectifs de l’entreprise et son équipe, sert de guide, et reste responsable devant ses <b>subordonnés, les clients, les fournisseurs, ses supérieurs</b>. Leviers : <b>stimuler</b>, <b>intervenir</b>. Tâches : <b>piloter, performer, résoudre, communiquer, anticiper, décider, organiser, animer</b>.</div>
<div class="enon" data-t="5 · niveaux et compétences"><p>Quels sont les niveaux de management et les compétences de chacun ?</p></div>
<div class="cor"><figure class="fig"><svg width="640" height="236" viewBox="0 0 640 236" role="img" aria-label="Les niveaux de management et les compétences dont chacun a surtout besoin."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><polygon points="160,10 250,90 70,90" style="fill:var(--acc);opacity:.85"/><polygon points="70,92 250,92 300,160 20,160" style="fill:var(--acc);opacity:.55"/><polygon points="20,162 300,162 340,226 -20,226" style="fill:var(--acc);opacity:.3"/><text x="160" y="62" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--card)">Cadres</text><text x="160" y="76" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--card)">dirigeants</text><text x="160" y="128" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Cadres intermédiaires</text><text x="160" y="196" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Cadres opérationnels</text><line x1="330" y1="60" x2="356" y2="60" style="stroke:var(--mut);stroke-width:1.3" marker-end="url(#fl)"/><text x="362" y="60" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">compétences conceptuelles</text><line x1="330" y1="128" x2="356" y2="128" style="stroke:var(--mut);stroke-width:1.3" marker-end="url(#fl)"/><text x="362" y="128" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">compétences humaines et interculturelles</text><line x1="330" y1="196" x2="356" y2="196" style="stroke:var(--mut);stroke-width:1.3" marker-end="url(#fl)"/><text x="362" y="196" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">compétences techniques</text></svg><figcaption>Les niveaux de management et les compétences dont chacun a surtout besoin.</figcaption></figure>Cadres <b>dirigeants</b> (stratégie, politique) : compétences <b>conceptuelles</b>. Cadres <b>intermédiaires</b> (coordination, cœur du réseau) : <b>humaines et interculturelles</b>. Cadres <b>opérationnels</b> (exécution) : <b>techniques</b>.</div>
<div class="enon" data-t="6 · les 10 rôles de Mintzberg (devoir 2024)"><p>Citer les rôles du manager par famille. Quels sont les rôles informationnels ?</p></div>
<div class="cor"><div class="tw"><table><tbody><tr><th>Interpersonnels (3)</th><td>figure de proue (représentation) · leader (recrute, dirige, encourage) · agent de liaison (réseau informel)</td></tr><tr><th>Informationnels (3)</th><td><b>observateur actif</b> (signaux internes et externes) · <b>diffuseur d’information</b> (vers l’équipe) · <b>porte-parole</b> (vers l’extérieur)</td></tr><tr><th>Décisionnels (4)</th><td>entrepreneur (initier) · régulateur (corriger) · répartiteur (allouer les ressources) · négociateur (arbitrer)</td></tr></tbody></table></div>Réponse du devoir : observateur actif, diffuseur d’information, porte-parole — les <b>noms</b>, pas une description.</div>
<div class="enon" data-t="7 · leadership et Drucker"><p>Définir le leadership. Différence entre manager et leader ?</p></div>
<div class="cor">Capacité d’un individu à <b>mener ou conduire</b> d’autres individus vers des objectifs ; selon les diapositives, capacité d’<b>influencer et fédérer</b> un groupe vers un objectif commun, cimentée par la <b>confiance mutuelle</b>. Le leader obtient les moyens d’action puis <b>répartit et délègue</b> (déléguer n’est pas abandonner : responsabiliser puis contrôler).<div class="tw"><table><thead><tr><th></th><th>Manager</th><th>Leader</th></tr></thead><tbody><tr><th>Focus</th><td>exécution et contrôle</td><td>vision et influence</td></tr><tr><th>Méthode</th><td>faire <b>correctement</b> les choses</td><td>faire les <b>bonnes</b> choses</td></tr><tr><th>Équipe</th><td>répartition précise des tâches</td><td>fédérer par la confiance</td></tr></tbody></table></div></div>
<div class="enon" data-t="8 · le manager moderne"><p>Quels sont les quatre profils du manager moderne ? Les quatre axes interculturels ? Ce qui reste au manager face à l’IA ?</p></div>
<div class="cor">Profils : <b>innovant</b> (vision, interfaces entre métiers, réseau) · <b>agile</b> (chaos, intelligence relationnelle, décision décentralisée) · <b>digital</b> (outils collaboratifs, équipes hommes-robots) · <b>global</b> (équipes multiculturelles, « distance zéro »). Interculturel : rapport à la <b>hiérarchie</b>, au <b>collectif</b>, gestion des <b>conflits</b>, du <b>temps</b> ; utiliser les différences comme une richesse. Face à l’IA : la décision complexe avec <b>responsabilité éthique</b>, le leadership, la créativité, la négociation, l’accompagnement humain. Manager Stack : coordinateur (fondation) → 10 rôles (système) → leader (cœur) → 4 profils (enveloppe).</div>

{ id: '8.4', t: 'La décision', h: `<div class="enon" data-t="9 · définition (phrase à trous 2024)"><p>Compléter : « La décision répond à l’apparition … C’est une divergence entre un état … et un état … » Que veut dire décider ? Trois caractéristiques ?</p></div>
<div class="cor">D’un <b>problème</b> ; état <b>actuel</b> ; état <b>souhaité</b> ; « qui impose d’envisager une ligne de conduite alternative ». Décider = <b>choisir entre deux ou plusieurs options</b>. L’entreprise est un <b>lieu de prises de décisions</b> multiples, d’inégale importance. Caractéristiques : <b>pas un acte unique</b>, <b>multi-variables</b>, <b>contexte aléatoire</b>.</div>
<div class="enon" data-t="10 · éléments et facteurs"><p>Citer les six éléments du processus décisionnel, puis les six facteurs qui influencent les décisions.</p></div>
<div class="cor">Éléments : <b>décideur</b> (le pouvoir de décider) · <b>objectifs et motivation</b> · <b>données et informations</b> (collecte et analyse préalables) · <b>prévision</b> (prédire les effets futurs) · <b>alternatives</b> · <b>climat</b>.<br>Facteurs : <b>style de direction · histoire · culture · mode de gouvernance · nature de la décision · niveau de rationalité</b>.</div>
<div class="enon" data-t="11 · types de décisions (devoir 2024)"><p>Qui prend les décisions stratégiques et pourquoi ? Comparer les trois types.</p></div>
<div class="cor"><figure class="fig"><svg width="680" height="200" viewBox="0 0 680 200" role="img" aria-label="La pyramide de la décision (Ansoff) : l’importance croît vers le haut."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><polygon points="200,10 260,70 140,70" style="fill:var(--amb);opacity:.9"/><polygon points="140,72 260,72 310,130 90,130" style="fill:var(--blue);opacity:.55"/><polygon points="90,132 310,132 360,190 40,190" style="fill:var(--blue);opacity:.3"/><line x1="20" y1="190" x2="20" y2="14" style="stroke:var(--mut);stroke-width:1.3" marker-end="url(#fl)"/><text x="14" y="100" text-anchor="middle" dominant-baseline="central" style="font:1px var(--sans);fill:var(--ink)"></text><text x="200" y="54" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--card)">Stratégiques</text><text x="200" y="104" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Administratives</text><text x="200" y="164" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Opérationnelles</text><text x="372" y="40" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">avenir, politique générale, marchés</text><text x="372" y="54" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">direction générale · non programmable</text><text x="372" y="98" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">ressources, structure, organisation</text><text x="372" y="112" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">directions fonctionnelles · semi-programmable</text><text x="372" y="156" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">rendent opérationnelles les options (prix, plannings)</text><text x="372" y="170" text-anchor="start" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">chefs de services · fréquentes, répétitives · programmable</text><text x="28" y="12" text-anchor="start" dominant-baseline="central" style="font:9px var(--sans);fill:var(--mut)">importance</text></svg><figcaption>La pyramide de la décision (Ansoff) : l’importance croît vers le haut.</figcaption></figure><div class="tw"><table><thead><tr><th></th><th>Stratégique</th><th>Administrative</th><th>Opérationnelle</th></tr></thead><tbody><tr><th>Horizon</th><td>long terme</td><td>court terme</td><td>très court terme</td></tr><tr><th>Réversibilité</th><td>nulle</td><td>faible</td><td>forte</td></tr><tr><th>Répétitivité</th><td>nulle</td><td>faible</td><td>forte</td></tr><tr><th>Niveau</th><td>direction générale</td><td>directions fonctionnelles</td><td>chefs de services, ateliers</td></tr><tr><th>Informations</th><td>incertaines, exogènes</td><td>presque complètes, endogènes</td><td>complètes, endogènes</td></tr><tr><th>Procédure</th><td>non programmable</td><td>semi-programmable</td><td>programmable</td></tr></tbody></table></div>La <b>direction générale</b>, parce que ces décisions <b>engagent l’avenir</b> de l’entreprise (politique générale, activités, marchés).</div>
<div class="enon" data-t="12 · le processus (devoir 2024)"><p>Donner les cinq phases dans l’ordre. Après quelle étape vient l’étape de décision ?</p></div>
<div class="cor"><figure class="fig"><svg width="400" height="250" viewBox="0 0 400 250" role="img" aria-label="Le cycle itératif de Simon (modèle IMCE) : le contrôle relance la boucle."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><circle cx="190" cy="120" r="82" style="fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:4 4"/><text x="190" y="114" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">processus</text><text x="190" y="128" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">itératif</text><circle cx="190" cy="38" r="9" style="fill:var(--acc)"/><text x="190.0" y="38.0" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--card)">1</text><text x="190.0" y="10.0" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Intelligence</text><text x="190.0" y="24.0" text-anchor="middle" dominant-baseline="central" style="font:9px var(--sans);fill:var(--mut)">percevoir, comprendre</text><circle cx="268" cy="95" r="9" style="fill:var(--acc)"/><text x="267.9866343362026" y="94.66060646125432" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--card)">2</text><text x="288.909877694696" y="81.86223258500547" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Modélisation</text><text x="288.909877694696" y="95.86223258500547" text-anchor="start" dominant-baseline="central" style="font:9px var(--sans);fill:var(--mut)">recenser les alternatives</text><circle cx="238" cy="186" r="9" style="fill:var(--acc)"/><text x="238.1983906879828" y="186.3393935387457" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--card)">3</text><text x="251.1296662384172" y="198.13776741499453" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Choix</text><text x="251.1296662384172" y="212.13776741499453" text-anchor="start" dominant-baseline="central" style="font:9px var(--sans);fill:var(--mut)">selon objectifs, critères</text><circle cx="142" cy="186" r="9" style="fill:var(--acc)"/><text x="141.8016093120172" y="186.3393935387457" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--card)">4</text><text x="128.8703337615828" y="198.13776741499453" text-anchor="end" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Décision</text><text x="128.8703337615828" y="212.13776741499453" text-anchor="end" dominant-baseline="central" style="font:9px var(--sans);fill:var(--mut)">mobiliser les moyens</text><circle cx="112" cy="95" r="9" style="fill:var(--acc)"/><text x="112.0133656637974" y="94.66060646125432" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--card)">5</text><text x="91.09012230530402" y="81.86223258500547" text-anchor="end" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">Contrôle</text><text x="91.09012230530402" y="95.86223258500547" text-anchor="end" dominant-baseline="central" style="font:9px var(--sans);fill:var(--mut)">mesurer les écarts</text></svg><figcaption>Le cycle itératif de Simon (modèle IMCE) : le contrôle relance la boucle.</figcaption></figure><b>Intelligence</b> (perception, compréhension) → <b>modélisation</b> (concevoir toutes les voies) → <b>choix</b> (sélection selon les objectifs) → <b>décision</b> (mobiliser les moyens physiques et financiers) → <b>contrôle</b> (comparer les résultats obtenus aux anticipés). L’étape de décision suit l’étape de <b>choix</b>. C’est le cycle <b>itératif</b> de Simon (IMCE).</div>
<div class="enon" data-t="13 · situations, outils, environnements (devoir 2024)"><p>Quelle décision prend le décideur qui connaît les probabilités de chaque alternative ? Donner les outils de chaque situation et les quatre environnements.</p></div>

itive « Modélisation de l’environnement »)."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><line x1="200" y1="10" x2="200" y2="230" style="stroke:var(--line);stroke-width:2"/><line x1="10" y1="120" x2="390" y2="120" style="stroke:var(--line);stroke-width:2"/><rect x="8" y="14" width="184" height="100" rx="8" style="fill:var(--grn);opacity:.12;stroke:none"/><text x="100" y="30" text-anchor="middle" dominant-baseline="central" style="font:700 13px var(--sans);fill:var(--grn)">Simple</text><text x="100" y="52" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">contexte stable</text><text x="100" y="68" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">changements prévisibles</text><text x="100" y="84" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">faits clairs</text><rect x="208" y="14" width="184" height="100" rx="8" style="fill:var(--amb);opacity:.12;stroke:none"/><text x="300" y="30" text-anchor="middle" dominant-baseline="central" style="font:700 13px var(--sans);fill:var(--amb)">Compliqué</text><text x="300" y="52" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">liens embrouillés</text><text x="300" y="68" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">simplifier pour revenir</text><text x="300" y="84" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--ink)">au simple</text><rect x="8" y="126" width="184" height="100" rx="8" style="fill:var(--red);opacity:.12;stroke:none"/><text x="100" y="142" text-anchor="middle" dominant-baseline="central" style="font:700 13px var(--sans);fill:var(--red)">Chaotique</text><text x="100" y="164" text-anchor="middle" dominant-baseline="ce <div class="enon" data-t="14 · intuition et matrice de synthèse"><p>Quand faire appel à l’intuition ? Où fonctionne la rationalité classique ?</p></div>

{ id: '8.5', t: 'Le changement', h: `<div class="enon" data-t="15 · définition et types"><p>Définir le changement. Citer les types de changement et ce qu’il touche dans l’entreprise.</p></div>
<div class="cor">Processus de <b>transformation radicale ou marginale</b> des <b>structures</b>, des <b>modes de gestion</b> et des <b>compétences</b> ; il exige l’apprentissage inconscient de nouveaux gestes mentaux et génère du <b>stress</b>. Entre l’état de <b>départ</b> et l’état d’<b>arrivée</b>, un chemin à parcourir.<figure class="fig"><svg width="640" height="122" viewBox="0 0 640 122" role="img" aria-label="Le changement comme passage : décongélation, zone d’incertitude, recongélation."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><line x1="20" y1="90" x2="620" y2="90" style="stroke:var(--red);stroke-width:2" marker-end="url(#fl)"/><text x="620" y="106" text-anchor="end" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--red)">temps</text><line x1="30" y1="70" x2="200" y2="70" style="stroke:var(--red);stroke-width:4"/><line x1="200" y1="70" x2="420" y2="34" style="stroke:var(--red);stroke-width:3;stroke-dasharray:5 4"/><line x1="420" y1="34" x2="600" y2="34" style="stroke:var(--red);stroke-width:4"/><text x="110" y="56" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">État A (départ)</text><text x="510" y="20" text-anchor="middle" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--ink)">État B (arrivée)</text><text x="310" y="76" text-anchor="middle" dominant-baseline="central" style="font:10px var(--sans);fill:var(--mut)">zone d’incertitude</text><text x="200" y="110" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--amb)">↑ décongélation</text><text x="420" y="110" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--amb)">↑ recongélation</text></svg><figcaption>Le changement comme passage : décongélation, zone d’incertitude, recongélation.</figcaption></figure>Types : <b>provoqué / subi</b> · <b>radical</b> · <b>planifié / spontané</b> · <b>apprentissage et évolution</b>. Il touche : l’<b>organisation du travail</b>, la <b>responsabilité et délégation</b> du personnel, la <b>structure</b>, le <b>cadre technologique</b>.</div>
<div class="enon" data-t="16 · réactions (phrase à trous 2024)"><p>Quelles sont les quatre réactions ? Chercher les éléments positifs et des moyens d’aider l’implantation : quelle réaction ? Décrire la courbe du changement.</p></div>
<div class="cor"><b>Dénégation</b> (comme si rien n’avait changé) → <b>résistance</b> (forces négatives, colère, sabotage) → <b>exploration</b> (éléments positifs, moyens d’aider l’implantation) → <b>engagement</b> (énergie, porte-parole du changement). Réponse du devoir : <b>exploration</b>.<figure class="fig"><svg width="490" height="210" viewBox="0 0 490 210" role="img" aria-label="La courbe du changement : le moral descend jusqu’à la dépression, puis remonte avec l’acceptation."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><line x1="30" y1="190" x2="470" y2="190" style="stroke:var(--ink)" marker-end="url(#fl)"/><line x1="30" y1="190" x2="30" y2="10" style="stroke:var(--ink)" marker-end="url(#fl)"/><path d="M30,90 L70,50 L120,70 L170,120 L220,160 L270,168 L330,130 L380,70 L430,30" style="fill:none;stroke:var(--amb);stroke-width:3;stroke-linejoin:round"/><circle cx="30" cy="90" r="4" style="fill:var(--amb)"/><text x="22" y="90" text-anchor="end" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">choc</text><circle cx="70" cy="50" r="4" style="fill:var(--amb)"/><text x="70" y="38" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">déni</text><circle cx="120" cy="70" r="4" style="fill:var(--amb)"/><text x="128" y="62" text-anchor="start" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">colère</text><circle cx="170" cy="120" r="4" style="fill:var(--amb)"/><text x="178" y="118" text-anchor="start" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">négociation</text><circle cx="220" cy="160" r="4" style="fill:var(--amb)"/><text x="212" y="166" text-anchor="end" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">dépression</text><circle cx="270" cy="168" r="4" style="fill:var(--amb)"/><text x="276" y="182" text-anchor="start" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">acceptation</text><circle cx="330" cy="130" r="4" style="fill:var(--amb)"/><text x="322" y="124" text-anchor="end" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">expérimentation</text><circle cx="380" cy="70" r="4" style="fill:var(--amb)"/><text x="372" y="66" text-anchor="end" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">décision</text><circle cx="430" cy="30" r="4" style="fill:var(--amb)"/><text x="430" y="18" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--ink)">intégration</text><text x="34" y="8" text-anchor="start" dominant-baseline="central" style="font:9px var(--sans);fill:var(--mut)">moral et productivité</text><text x="470" y="202" text-anchor="end" dominant-baseline="central" style="font:9px var(--sans);fill:var(--mut)">temps</text></svg><figcaption>La courbe du changement : le moral descend jusqu’à la dépression, puis remonte avec l’acceptation.</figcaption></figure></div>
<div class="enon" data-t="17 · résistance (devoir 2024)"><p>Donner les raisons de la résistance. Comment la gérer ?</p></div>
<div class="cor">Douze raisons : mauvaise <b>compréhension</b> du sens · <b>peur de l’inconnu</b> (la plus courante) · manque de <b>compétences</b> · attachement aux <b>anciennes manières</b> · manque de <b>confiance</b> · <b>mode passagère</b> · absence de <b>consultation</b> · mauvaise <b>communication</b> · rupture de la <b>routine</b> · <b>saturation</b> · changement de <b>statu quo</b> · absence de <b>récompense</b>.<br>Gérer : <b>constituer une équipe de changement</b>, <b>impliquer la hiérarchie</b>, <b>communiquer</b>, <b>former</b> (et consulter, récompenser).</div>
<div class="enon" data-t="18 · conduire le changement"><p>Donner les huit étapes de Kotter, les sept étapes de la mise en œuvre et les pratiques déconseillées.</p></div>

" style="font:700 11px var(--sans);fill:var(--ink)">8</text><text x="608" y="36" text-anchor="middle" dominant-baseline="central" style="font:9px var(--sans);fill:var(--ink)">Ancrer dans</text><text x="608" y="48" text-anchor="middle" dominant-baseline="central" style="font:9px var(--sans);fill:var(--ink)">la culture</text><text x="130" y="264" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--acc)">préparer</text><text x="370" y="264" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--blue)">lancer</text><text x="570" y="264" text-anchor="middle" dominant-baseline="central" style="font:700 10px var(--sans);fill:var(--amb)">faire durer</text></svg><figcaption>Les huit étapes de Kotter, en escalier : préparer, lancer, faire durer.</figcaption></figure>Étape 1 : légitimer le changement, prouver les risques de l’immobilisme (SWOT), sortir de la zone de confort. Étape 8 : intégrer dans la culture, mettre à jour les procédures, vérifier par PDCA.<br><b>Mise en œuvre</b> : préparation (sommes-nous prêts ?) → diagnostic partagé (pourquoi ?) → évaluation de l’existant (où en sommes-nous ?) → organisation cible (où aller ?) → ordre du jour (quoi changer ?) → implantation (exécuter) → ratification et stabilisation (maintenir le momentum).<br><b>Déconseillé</b> : objectifs flous, irréalisables ou changés en cours de projet ; périmètre non respecté ; pas d’indicateurs de suivi ; style de management non adapté.</div>

{ id: '8.6', t: 'Les compétences', h: `<div class="enon" data-t="19 · la compétence"><p>Définir la compétence, citer ses six éléments et ses deux moyens d’acquisition. Réelles ou requises ?</p></div>
<div class="cor">Un <b>savoir agir face à des situations problèmes</b> en satisfaisant des critères de performance ; l’ensemble des connaissances, qualités, capacités, aptitudes qui permettent de discuter, consulter, décider sur son métier. Éléments : <b>savoir, savoir-faire, savoir-être, savoir mobiliser, vouloir mobiliser, pouvoir agir</b>. Acquisition : <b>formation</b>, <b>expérience</b> professionnelle et extraprofessionnelle. <b>Réelles</b> : possédées par l’individu ; <b>requises</b> : exigées par le poste.</div>
<div class="enon" data-t="20 · le management des compétences (tableau du devoir 2024)"><p>Définir le management des compétences, dire à quoi il sert, donner ses quatre niveaux, puis remplir le tableau du devoir (objectif et deux mécanismes, individuelles et collectives).</p></div>
<div class="cor">Un <b>mode de pilotage</b> qui fait des compétences un <b>vecteur majeur de performance et de création de valeur</b>. Il sert à <b>développer</b> le capital humain, <b>adapter</b> les compétences aux emplois, <b>recruter</b>, <b>motiver</b>, <b>fidéliser</b>.<figure class="fig"><svg width="540" height="240" viewBox="0 0 540 240" role="img" aria-label="Les quatre niveaux du management des compétences : on s’élargit du salarié à l’extérieur."><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mut)"/></marker></defs><circle cx="140" cy="122" r="112" style="fill:var(--mut);opacity:.15;stroke:var(--mut);stroke-width:1.6"/><circle cx="140" cy="122" r="84" style="fill:var(--amb);opacity:.15;stroke:var(--amb);stroke-width:1.6"/><circle cx="140" cy="122" r="56" style="fill:var(--blue);opacity:.15;stroke:var(--blue);stroke-width:1.6"/><circle cx="140" cy="122" r="28" style="fill:var(--acc);opacity:.15;stroke:var(--acc);stroke-width:1.6"/><line x1="140" y1="122" x2="270" y2="122" style="stroke:var(--line)"/><text x="276" y="122" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--acc)">Individuelles : le salarié</text><line x1="140" y1="80" x2="270" y2="80" style="stroke:var(--line)"/><text x="276" y="80" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--blue)">Collectives : l’équipe</text><line x1="140" y1="52" x2="270" y2="52" style="stroke:var(--line)"/><text x="276" y="52" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--amb)">Stratégiques : l’entreprise entière</text><line x1="140" y1="22" x2="270" y2="22" style="stroke:var(--line)"/><text x="276" y="22" text-anchor="start" dominant-baseline="central" style="font:700 11px var(--sans);fill:var(--mut)">Environnementales : hors de l’entreprise</text></svg><figcaption>Les quatre niveaux du management des compétences : on s’élargit du salarié à l’extérieur.</figcaption></figure>Stratégiques : <b>savoirs, systèmes techniques, systèmes de management, valeurs et normes</b> ; avantage concurrentiel soutenable.<div class="tw"><table><thead><tr><th></th><th>Objectif</th><th>Mécanismes</th></tr></thead><tbody><tr><th>Individuelles</th><td>meilleur niveau de compétences chez chaque salarié, adapté à son emploi</td><td>formation · expérience professionnelle</td></tr><tr><th>Collectives</th><td>une équipe qui sait coopérer (proposition)</td><td>travail en équipe · partage d’expérience (proposition)</td></tr></tbody></table></div></div>
