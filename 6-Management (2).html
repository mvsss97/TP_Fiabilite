<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Management d’entreprise — révision</title>
<style>
:root{
  --bg:#F3F0E8;--panel:#FAF8F2;--card:#FFFDF8;--ink:#2C2B28;--mut:#6B6860;--line:#E2DDD0;
  --acc:#2E6F6B;--acc-soft:#DCEBE8;--amb:#9A5F0E;--amb-soft:#F6EAD2;--red:#A8483D;--red-soft:#F5E1DC;
  --grn:#3A7446;--grn-soft:#DFEDDD;--blue:#3C6591;--blue-soft:#DEE8F2;--fs:17px;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Cambria,"Cambria Math",Georgia,"Times New Roman",serif;
}
:root[data-theme="sombre"]{
  --bg:#1B1D1F;--panel:#202326;--card:#262A2D;--ink:#DAD6CC;--mut:#9C988E;--line:#363A3F;
  --acc:#6FB8B1;--acc-soft:#21373A;--amb:#D9A441;--amb-soft:#3A3122;--red:#E08A7D;--red-soft:#3D2725;
  --grn:#86C08F;--grn-soft:#24352A;--blue:#8DB4DE;--blue-soft:#243242;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.25;margin:0 0 .5em;text-wrap:balance;font-weight:700}
h1{font-size:2.1em}h2{font-size:1.5em}h3{font-size:1.2em}h4{font-size:1.02em;font-family:var(--sans)}
p{margin:.6em 0}ul,ol{margin:.5em 0;padding-left:1.3em}li{margin:.25em 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* ---------- structure ---------- */
#app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:14px}
.brand{padding:4px 8px}.brand small{display:block;color:var(--mut);font-size:.72em;letter-spacing:.08em;text-transform:uppercase}
.brand b{font-family:var(--serif);font-size:1.18em;line-height:1.2;display:block;margin-top:2px}
.search{position:relative}.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.9em}
.res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:30;max-height:60vh;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.14)}
.res a{display:block;padding:8px 12px;color:var(--ink);font-size:.86em;border-bottom:1px solid var(--line);line-height:1.4}
.res a:hover{background:var(--acc-soft);text-decoration:none}.res small{color:var(--mut);display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sep{font-size:.7em;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;color:var(--ink);font-size:.92em;line-height:1.3}
.nav a:hover{background:var(--acc-soft);text-decoration:none}
.nav a.on{background:var(--acc);color:var(--card)}.nav a.on .num{background:rgba(255,255,255,.22);color:inherit}
.num{flex:none;width:24px;height:24px;border-radius:7px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:.8em;font-weight:700}
.nav .t{flex:1;min-width:0}.nav .pc{font-size:.74em;opacity:.75;font-variant-numeric:tabular-nums}
.badge{background:var(--amb);color:var(--card);border-radius:20px;padding:0 7px;font-size:.74em;font-weight:700}
.prefs{margin-top:auto;display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.prefs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 4px;font-size:.82em}
.prefs button:hover{border-color:var(--acc)}
.main{padding:34px clamp(16px,4vw,54px) 90px;min-width:0}
.wrap{max-width:860px;margin:0 auto}
.burger{display:none}

/* ---------- éléments ---------- */
.eyebrow{font-size:.74em;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.lead{font-size:1.08em;color:var(--mut);max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin:18px 0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 16px;font-size:.92em;font-weight:600}
.btn:hover{border-color:var(--acc);text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--card)}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:.82em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat b{display:block;font-family:var(--serif);font-size:1.9em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--mut);font-size:.84em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.chap{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:var(--ink);transition:transform .15s,border-color .15s}
.chap:hover{border-color:var(--acc);transform:translateY(-2px);text-decoration:none}
.chap h3{margin:8px 0 2px}.chap small{color:var(--mut);display:block;margin-bottom:12px;font-style:italic}
.chap .meta{display:flex;justify-content:space-between;font-size:.8em;color:var(--mut);margin-top:6px}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li:before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:.9em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:22px 0 8px;position:sticky;top:0;background:var(--bg);z-index:20;padding-top:8px}
.tabs a{padding:9px 15px;border-radius:10px 10px 0 0;color:var(--mut);font-weight:600;font-size:.93em;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--ink);text-decoration:none}.tabs a.on{color:var(--acc);border-bottom-color:var(--acc)}
.toc{columns:2;column-gap:28px;font-size:.92em;padding:0;list-style:none}
.toc li{break-inside:avoid;display:flex;gap:8px;align-items:baseline}.toc .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--line);flex:none;transform:translateY(1px)}
.toc .dot.ok{background:var(--grn);border-color:var(--grn)}

/* ---------- cours ---------- */
.sec{scroll-margin-top:70px}
.sec>h2{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec>h2 .n{color:var(--acc);font-size:.75em;font-family:var(--sans);font-variant-numeric:tabular-nums}
.sec p,.sec li{max-width:70ch}
.sec h4{margin:1.3em 0 .3em;color:var(--acc)}
.done{display:flex;justify-content:flex-end;margin-top:14px}
.done label{display:inline-flex;gap:8px;align-items:center;font-size:.86em;color:var(--mut);cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 14px}
.done input{accent-color:var(--grn);width:16px;height:16px}.done label.ok{background:var(--grn-soft);color:var(--grn);border-color:transparent}
.en{font-size:.78em;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:1px 7px;white-space:nowrap;font-style:italic;font-weight:500}
.def,.tip,.warn,.ex{border-radius:12px;padding:12px 16px 12px 18px;margin:14px 0;border-left:4px solid;max-width:74ch}
.def{background:var(--acc-soft);border-color:var(--acc)}
.tip{background:var(--amb-soft);border-color:var(--amb)}
.warn{background:var(--red-soft);border-color:var(--red)}
.ex{background:var(--blue-soft);border-color:var(--blue)}
.def:before,.tip:before,.warn:before,.ex:before{display:block;font-size:.7em;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.def:before{content:"Définition";color:var(--acc)}.tip:before{content:"Astuce mémoire";color:var(--amb)}
.warn:before{content:"Piège d'examen";color:var(--red)}.ex:before{content:"Exemple du cours";color:var(--blue)}
.f{font-family:var(--serif);font-size:1.14em;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 18px;margin:12px 0;overflow-x:auto;white-space:nowrap;text-align:center}
.f small{font-family:var(--sans);color:var(--mut);font-size:.72em;white-space:normal;display:block;margin-top:4px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.25}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .3em 1px}.fr>span:last-child{padding:1px .3em 0}
details.q{border:1px dashed var(--acc);border-radius:12px;padding:10px 16px;margin:14px 0;max-width:74ch}
details.q summary{cursor:pointer;font-weight:600;color:var(--acc)}
details.q summary:before{content:"Question éclair — ";font-weight:400;color:var(--mut)}
details.q[open] summary{margin-bottom:6px}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:.92em}
.tw{overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--panel);font-weight:700}
td.c,th.c{text-align:center;font-variant-numeric:tabular-nums}
code,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:.9em}
pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;overflow-x:auto;font:.85em/1.55 Consolas,monospace}

/* ---------- cartes ---------- */
.fc{perspective:1400px;max-width:640px;margin:22px auto}
.fc-in{position:relative;min-height:280px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.07)}
.fc-b{transform:rotateY(180deg);background:var(--acc-soft);border-color:transparent}
.fc-f .k{font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);position:absolute;top:16px}
.fc-f .txt{font-family:var(--serif);font-size:1.35em;line-height:1.35}.fc-b .txt{font-size:1.02em;line-height:1.6}
.fc-f .hint{position:absolute;bottom:14px;font-size:.78em;color:var(--mut)}
.fc-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:44px}
.fc-act .r0{border-color:var(--red);color:var(--red)}.fc-act .r1{border-color:var(--amb);color:var(--amb)}.fc-act .r2{border-color:var(--grn);color:var(--grn)}
.boxes{display:flex;gap:6px;justify-content:center;margin:12px 0;font-size:.78em;color:var(--mut);flex-wrap:wrap}
.boxes span{border:1px solid var(--line);border-radius:8px;padding:2px 10px;background:var(--card)}

/* ---------- quiz ---------- */
.qz-top{display:flex;justify-content:space-between;font-size:.84em;color:var(--mut);margin-bottom:6px}
.qz-q{margin:22px 0 14px;font-size:1.22em}
.qz-o{display:grid;gap:9px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;line-height:1.45}
.opt b{width:28px;height:28px;border-radius:8px;background:var(--panel);display:grid;place-items:center;font-size:.85em}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--grn-soft);border-color:var(--grn)}.opt.ko{background:var(--red-soft);border-color:var(--red)}.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.fb{border-radius:12px;padding:12px 16px;margin:14px 0}.fb.ok{background:var(--grn-soft)}.fb.ko{background:var(--red-soft)}
.note{font-family:var(--serif);font-size:3.4em;line-height:1;font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 14px}

/* ---------- exercices ---------- */
.exo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px 0}
.exo h3{margin-bottom:6px}.exo .lvl{font-size:.74em;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.exo details{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.exo summary{cursor:pointer;color:var(--acc);font-weight:600}

/* ---------- labos ---------- */
.lab{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0}
.lab>h4{margin:0 0 4px;color:var(--amb);font-size:.74em;letter-spacing:.09em;text-transform:uppercase}
.lab .ttl{font-family:var(--serif);font-size:1.15em;font-weight:700;margin-bottom:8px}
.lab svg{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;touch-action:none;user-select:none}
.lab .ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0;font-size:.88em}
.lab label{display:inline-flex;gap:8px;align-items:center}
.lab input[type=range]{accent-color:var(--acc);width:150px}
.lab select,.lab input[type=number]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.lab input[type=number]{width:74px}
.lab .out{font-size:.9em}.lab .out b{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 12px;font-size:.88em;border-right:1px solid var(--line)}.seg button:last-child{border:0}
.seg button.on{background:var(--acc);color:var(--card)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.kv div{background:var(--panel);border-radius:9px;padding:6px 10px;font-size:.8em;color:var(--mut)}.kv b{display:block;color:var(--ink);font-size:1.25em;font-variant-numeric:tabular-nums}
.gn{fill:var(--card);stroke:var(--ink);stroke-width:1.6}.gn.hi{fill:var(--acc);stroke:var(--acc)}.gn.cur{fill:var(--amb);stroke:var(--amb)}.gn.sel{stroke:var(--amb);stroke-width:3.5}
.gl{stroke:var(--mut);stroke-width:1.8}.gl.hi{stroke:var(--acc);stroke-width:2.6}.gl.br{stroke:var(--red);stroke-width:3}.gl.fa{stroke:var(--line)}
.gt{font:600 12px var(--sans);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}.gt.hi{fill:var(--card)}
.ax{stroke:var(--line);stroke-width:1}.axt{font:11px var(--sans);fill:var(--mut)}

@media (max-width:920px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:292px;z-index:50;transform:translateX(-100%);transition:transform .25s}
  body.open .side{transform:none;box-shadow:0 0 60px rgba(0,0,0,.35)}
  .burger{display:inline-flex;position:fixed;right:14px;bottom:14px;z-index:60;width:50px;height:50px;border-radius:50%;border:0;background:var(--acc);color:var(--card);font-size:1.3em;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .toc{columns:1}.main{padding-top:20px}h1{font-size:1.7em}
}
@media print{
  .side,.tabs,.burger,.done,.noprint{display:none!important}#app{display:block}body{background:#fff;color:#000;font-size:12pt}
  .card,.exo,.lab{border-color:#bbb;break-inside:avoid}details{display:block}details>*{display:block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- QCM à réponses multiples, encadrés « examen » et « complément », schémas en chaîne ---------- */
.qz-multi{color:var(--amb);font-size:.9em;margin:-6px 0 12px}
.exam,.plus{border-radius:12px;padding:12px 16px 12px 18px;margin:14px 0;max-width:74ch}
.exam{background:var(--panel);border:1px dashed var(--amb)}
.plus{background:var(--panel);border-left:4px solid var(--mut)}
.exam:before,.plus:before{display:block;font-size:.7em;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.exam:before{content:"Vu à l'examen";color:var(--amb)}
.plus:before{content:"Complément (au-delà des diapos)";color:var(--mut)}
.flow{display:flex;flex-wrap:wrap;gap:8px 0;align-items:stretch;margin:14px 0}
.flow>span{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.88em;line-height:1.35;display:flex;flex-direction:column;justify-content:center;max-width:210px}
.flow>span small{color:var(--mut)}
.flow>span+span{margin-left:26px;position:relative}
.flow>span+span:before{content:"→";position:absolute;left:-21px;top:50%;transform:translateY(-50%);color:var(--acc);font-weight:700}
.flow>span.cut{border-color:var(--amb);background:var(--amb-soft)}
.lab .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lab .node{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84em;overflow-wrap:anywhere}
.lab .node h5{margin:0 0 4px;font-size:.78em;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.lab .node.off{opacity:.35;text-decoration:line-through}
.lab .stp{background:var(--acc-soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.92em}
@media (max-width:640px){.lab .grid3{grid-template-columns:1fr}}

/* exercices intégrés au cours : calcul à réponse vérifiée, choix, relier */
.pra{border-left:4px solid var(--blue);max-width:78ch}
.pra .lvl{color:var(--blue);font-weight:700}
.pra .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.pra input[type=text]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:150px}
.pra input.ok{border-color:var(--grn);background:var(--grn-soft)}.pra input.ko{border-color:var(--red);background:var(--red-soft)}
.pra .fb{margin:8px 0;padding:8px 12px;font-size:.93em}
.pra .cho{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer;line-height:1.45}
.pra .cho:hover:not(:disabled){border-color:var(--acc)}
.pra .cho.sel{border-color:var(--acc);background:var(--acc-soft)}.pra .cho.ok{border-color:var(--grn);background:var(--grn-soft)}.pra .cho.ko{border-color:var(--red);background:var(--red-soft)}
.pra .rl{display:grid;grid-template-columns:minmax(110px,230px) 1fr;gap:6px 12px;align-items:center;margin:7px 0;font-size:.95em}
.pra .rl select{font:inherit;font-size:.92em;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%;min-width:0;width:100%}
.pra .rl.ok select{border-color:var(--grn);background:var(--grn-soft)}.pra .rl.ko select{border-color:var(--red);background:var(--red-soft)}
.pra .rl small{grid-column:2;color:var(--grn)}
@media (max-width:640px){.pra .rl{grid-template-columns:1fr}.pra .rl small{grid-column:1}}
.meth{border-radius:12px;padding:12px 16px 12px 18px;margin:14px 0;max-width:74ch;background:var(--blue-soft);border-left:4px solid var(--blue)}
.meth:before{content:"Méthode pas à pas";display:block;font-size:.7em;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:2px;color:var(--blue)}
.ill{border-radius:12px;padding:12px 16px 12px 18px;margin:14px 0;border-left:4px solid var(--blue);background:var(--blue-soft);max-width:74ch}
.ill:before{content:"Exemple";display:block;font-size:.7em;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:2px;color:var(--blue)}
.pra .od{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}.pra .od.ok{border-color:var(--grn);background:var(--grn-soft)}.pra .od.ko{border-color:var(--red);background:var(--red-soft)}

/* téléphone : une liste déroulante ne dépasse jamais la largeur de l’écran */
select{max-width:100%}
label{max-width:100%;min-width:0}

{ id: '2.1', t: 'Définition et pilotage', h: `
<div class="def">Le <b>management</b> est l’ensemble des <b>techniques d’organisation</b> mises en œuvre pour l’<b>administration</b>, au sens large, d’une entreprise.<br>C’est aussi l’<b>art de gérer des ressources limitées</b> de la manière la plus <b>performante</b> pour réaliser des <b>objectifs fixés par les managers</b>.</div>
<p>Trois mots à ne pas oublier dans la définition : <b>ressources limitées</b>, <b>performante</b>, <b>objectifs</b>.</p>
<div class="exam"><b>Phrase à trous du devoir 2024 :</b> « Piloter une entreprise, c’est lui assigner des <b>objectifs</b> hiérarchisés, cohérents, avec des échéances, et mettre en œuvre les <b>moyens</b> permettant de les atteindre. »</div>
<div data-lab="rappel"><p>Complète : « Le management est l’art de gérer des … … de la manière la plus … pour réaliser des … fixés par les managers. »</p>
<ul><li>ressources limitées|ressource</li><li>performante|performan</li><li>objectifs|objectif</li></ul>
<div class="sol">Ressources limitées · performante · objectifs.</div></div>
<div data-lab="rappel"><p>Complète : « Piloter une entreprise, c’est lui assigner des … hiérarchisés, cohérents, avec des échéances, et mettre en œuvre les … permettant de les atteindre. »</p>
<ul><li>objectifs|objectif</li><li>moyens|moyen</li></ul>
<div class="sol">Des objectifs, puis les moyens. La copie du dossier a écrit « des actions » et a perdu le point.</div></div>` },

{ id: '2.2', t: 'Les deux horizons et les deux volets', h: `
<div class="tw"><table>
<thead><tr><th>Horizon</th><th>Définition du cours</th><th>Repère</th></tr></thead>
<tbody>
<tr><th>Management <b>stratégique</b></th><td>ensemble des actions menées par la <b>direction générale</b> pour assurer la <b>survie et le développement</b> de l’entreprise dans un <b>environnement changeant</b></td><td>long terme, toute l’entreprise</td></tr>
<tr><th>Management <b>opérationnel</b></th><td>ensemble des décisions prises <b>quotidiennement</b> pour atteindre les <b>objectifs fixés</b></td><td>court terme, le terrain</td></tr>
</tbody></table></div>
<div class="exam"><b>Devoir 2024 :</b> « Quel horizon de management prend en charge le suivi des capacités de production au quotidien ? » → l’horizon <b>opérationnel</b> (le mot « quotidien » est l’indice).</div>
<h4>Les deux volets (ou domaines) du management</h4>
<ul><li>le management des <b>personnes</b> ;</li><li>le management des <b>moyens</b>.</li></ul>
<div class="exam"><b>Devoir 2024 :</b> « Quels sont les domaines du management ? » → management des personnes et management des moyens.</div>
<div data-lab="choix" data-a="0"><p>« Décider de s’implanter sur un nouveau marché à l’étranger » relève du management :</p>
<ul><li>stratégique</li><li>opérationnel</li></ul>
<div class="sol">Cela engage le développement de toute l’entreprise et vient de la direction générale.</div></div>
<div data-lab="choix" data-a="1"><p>« Réorganiser le planning de l’atelier pour la semaine » relève du management :</p>
<ul><li>stratégique</li><li>opérationnel</li></ul>
<div class="sol">Décision du quotidien pour atteindre des objectifs déjà fixés.</div></div>
<div data-lab="rappel"><p>Cite les deux volets (domaines) du management.</p>
<ul><li>Management des personnes|personne</li><li>Management des moyens|moyen</li></ul>
<div class="sol">Personnes et moyens.</div></div>` },

{ id: '2.3', t: 'La démarche et les quatre dimensions', h: `
<h4>La démarche managériale : trois étapes</h4>
<div class="flow"><span>Fixer les <b>objectifs</b></span><span>Mobiliser les <b>ressources</b> humaines, matérielles, financières</span><span>Évaluer les <b>résultats</b></span></div>
<h4>Les quatre dimensions du management</h4>
<p>Le cours donne les quatre noms. La deuxième colonne est un complément pour savoir à quoi chacune sert.</p>
<div class="tw"><table>
<thead><tr><th>Dimension</th><th>Ce que fait le manager</th></tr></thead>
<tbody>
<tr><th>La <b>planification</b></th><td>il <b>définit les objectifs</b> et prévoit comment les atteindre</td></tr>
<tr><th>L’<b>organisation</b></th><td>il répartit les tâches, les responsabilités et les ressources</td></tr>
<tr><th>La <b>direction</b></th><td>il anime, motive et guide les personnes</td></tr>
<tr><th>Le <b>contrôle</b></th><td>il compare les résultats aux objectifs et corrige</td></tr>
</tbody></table></div>
<div class="tip"><b>P-O-D-C</b> : <b>P</b>lanifier, <b>O</b>rganiser, <b>D</b>iriger, <b>C</b>ontrôler.</div>
<div class="exam"><b>Devoir 2024 :</b> « Dans quelle dimension du management le manager définit-il les objectifs de l’entreprise ? » → la <b>planification</b>.</div>
<div data-lab="ordre"><p>Remets les trois étapes de la démarche managériale dans l’ordre.</p>
<ol><li>La fixation des objectifs</li><li>La mobilisation des ressources humaines, matérielles, financières</li><li>L’évaluation des résultats obtenus</li></ol>
<div class="sol">Objectifs, ressources, évaluation.</div></div>
<div data-lab="rappel"><p>Cite les quatre dimensions du management.</p>
<ul><li>La planification|planif</li><li>L’organisation|organis</li><li>La direction|direction|dirig</li><li>Le contrôle|control</li></ul>
<div class="sol">Planification, organisation, direction, contrôle.</div></div>
<div data-lab="relier"><p>Relie chaque situation à sa dimension.</p>
<dl><dt>Fixer le chiffre d’affaires à atteindre l’an prochain</dt><dd>Planification</dd>
<dt>Répartir les tâches entre les services</dt><dd>Organisation</dd>
<dt>Motiver l’équipe</dt><dd>Direction</dd>
<dt>Comparer les ventes réalisées aux ventes prévues</dt><dd>Contrôle</dd></dl></div>` },

{ id: '2.4', t: 'Les quatre modes de management', h: `
<p>Le cours donne les quatre noms. La description de chaque mode est un complément, cohérent avec la phrase du devoir.</p>
<div class="tw"><table>
<thead><tr><th>Mode</th><th>Qui décide ?</th><th>Indice dans une phrase</th></tr></thead>
<tbody>
<tr><th><b>Directif</b></th><td>le manager seul ; il ordonne et contrôle</td><td>« impose », « donne des ordres »</td></tr>
<tr><th><b>Persuasif</b></th><td>le manager, mais il explique et convainc</td><td>« explique », « convainc »</td></tr>
<tr><th><b>Participatif</b></th><td>le manager avec son équipe</td><td>« encourage les initiatives », « associe », « consulte »</td></tr>
<tr><th><b>Délégatif</b></th><td>l’équipe ; le manager confie la décision</td><td>« confie », « laisse décider »</td></tr>
</tbody></table></div>
<div class="exam"><b>Devoir 2024 :</b> « Quand le manager encourage les initiatives dans la prise de décision, il aura probablement un mode de management <b>participatif</b>. »</div>
<div data-lab="rappel"><p>Cite les quatre modes de management.</p>
<ul><li>Directif|directif</li><li>Persuasif|persuasi</li><li>Participatif|participati</li><li>Délégatif|delegati|delatif</li></ul>
<div class="sol">Directif, persuasif, participatif, délégatif.</div></div>
<div data-lab="relier"><p>Relie chaque comportement au mode de management.</p>
<dl><dt>Il donne des consignes précises et vérifie tout</dt><dd>Directif</dd>
<dt>Il décide, puis explique longuement pour convaincre</dt><dd>Persuasif</dd>
<dt>Il encourage les initiatives dans la prise de décision</dt><dd>Participatif</dd>
<dt>Il confie la décision à son équipe</dt><dd>Délégatif</dd></dl></div>` },

{ id: '2.5', t: 'Management moderne et management situationnel', h: `
<div class="dia"><b>Le management moderne</b> cherche à <b>concilier trois dimensions</b> pour assurer la <b>pérennité</b> de l’organisation de demain : la <b>performance économique</b>, la <b>performance humaine</b> et la <b>capacité d’adaptation</b>.</div>
<div class="dia"><b>Le management situationnel.</b> Il n’existe <b>pas de style idéal</b> : l’efficacité exige d’adopter l’attitude que <b>commande la situation</b>. Pour choisir le style (directif, persuasif, participatif, délégatif), <b>deux éléments</b> doivent être pris en compte :
<ul><li>les <b>types de collaborateurs</b> (leur autonomie, à évaluer en permanence) ;</li><li>les <b>caractéristiques du contexte et du problème</b> à régler.</li></ul>
« Il n’y a pas <b>un</b> style de management, mais <b>des</b> styles. C’est <b>vous</b> qui devez vous adapter, et non à vos équipes de s’adapter à vous. »</div>
<div data-lab="rappel"><p>Le management moderne concilie trois dimensions. Lesquelles ?</p>
<ul><li>Performance économique|economi</li><li>Performance humaine|humain</li><li>Capacité d’adaptation|adapt</li></ul>
<div class="sol">Performance économique, performance humaine, capacité d’adaptation, pour assurer la pérennité.</div></div>
<div data-lab="rappel"><p>Pour choisir un style de management, quels deux éléments faut-il prendre en compte ?</p>
<ul><li>Les types de collaborateurs|collaborat</li><li>Les caractéristiques du contexte et du problème|contexte|probleme</li></ul>
<div class="sol">Les types de collaborateurs ; les caractéristiques du contexte et du problème à régler.</div></div>
<div data-lab="choix" data-a="1"><p>Selon le management situationnel :</p>
<ul><li>le style participatif est toujours le meilleur</li><li>il n’existe pas de style idéal, le manager s’adapte à la situation</li><li>l’équipe doit s’adapter au style du manager</li></ul>
<div class="sol">Pas de style idéal ; c’est au manager de s’adapter.</div></div>` }

{ id: '3.1', t: 'Qui est le manager ?', h: `
<div class="def">Le <b>manager</b> est un <b>responsable d’équipe</b>. Il est chargé de <b>coordonner</b>, <b>organiser</b>, <b>répartir les missions</b> et <b>vérifier le travail</b> de son ou ses équipes.</div>
<div class="tip">Quatre verbes : <b>coordonner, organiser, répartir, vérifier</b>.</div>
<div class="dia"><b>Une interface à double sens.</b> Le manager fait le <b>pont</b> entre les <b>objectifs de l’entreprise</b> (stratégie globale, impératifs de la direction) et la <b>bonne marche</b> de son <b>équipe</b> (l’exécution). Il sert de <b>guide</b> et reste <b>responsable</b> des actions à mener, devant ses <b>subordonnés</b>, les <b>clients</b>, les <b>fournisseurs</b> et ses <b>supérieurs hiérarchiques</b>. Ce n’est pas un simple superviseur : c’est un moyen d’influence qui gère des ressources limitées <b>par, avec et à travers les autres</b>.</div>
<div class="dia"><b>Le manager, vecteur d’influence</b> : il ne se contente pas d’observer, il agit sur <b>deux leviers</b> : <b>stimuler</b> (pousser les collaborateurs à améliorer continuellement leurs résultats) et <b>intervenir</b> (agir au moment critique pour que les décisions adéquates soient adoptées).</div>
<div data-lab="rappel"><p>Le manager est responsable devant quatre catégories de personnes. Lesquelles ?</p>
<ul><li>Ses subordonnés|subordon</li><li>Les clients|client</li><li>Les fournisseurs|fournisseur</li><li>Ses supérieurs hiérarchiques|superieur|hierarch</li></ul>
<div class="sol">Subordonnés, clients, fournisseurs, supérieurs hiérarchiques.</div></div>
<div data-lab="rappel"><p>Les deux leviers du manager vecteur d’influence ?</p>
<ul><li>Stimuler|stimul</li><li>Intervenir|interven</li></ul>
<div class="sol">Stimuler (améliorer les résultats) et intervenir (au moment critique).</div></div>
<div data-lab="rappel"><p>Le manager est chargé de quatre choses. Lesquelles ?</p>
<ul><li>Coordonner|coordon</li><li>Organiser|organis</li><li>Répartir les missions|repart|mission</li><li>Vérifier le travail|verif|control</li></ul>
<div class="sol">Coordonner, organiser, répartir les missions, vérifier le travail de son équipe.</div></div>` },

{ id: '3.2', t: 'Les rôles du manager', h: `
<p>Le cours reprend les <b>10 rôles de Mintzberg</b>, classés en <b>trois familles</b>. C’est la question qui a coûté un point entier à la copie du dossier : il faut les <b>noms</b>.</p>
<div class="tw"><table>
<thead><tr><th>Famille</th><th>Rôles du cours</th><th>En clair</th></tr></thead>
<tbody>
<tr><th>Rôles <b>interpersonnels</b><br><small>les relations</small></th><td><b>figure de proue</b> · <b>leader</b> · <b>agent de liaison</b></td><td>il représente l’équipe, il la mène, il la relie aux autres</td></tr>
<tr><th>Rôles <b>informationnels</b><br><small>l’information</small></th><td><b>observateur actif</b> · <b>diffuseur d’information</b> · <b>porte-parole</b></td><td>il cherche l’information, la transmet à l’équipe, la porte vers l’extérieur</td></tr>
<tr><th>Rôles <b>décisionnels</b><br><small>l’action</small></th><td><b>entrepreneur</b> · <b>régulateur</b> · <b>répartiteur</b> (de ressources) · <b>négociateur</b></td><td><b>initier</b> : adapte l’organisation à son environnement, lance de nouvelles idées · <b>corriger</b> : intervient quand la situation se brouille, rétablit l’équilibre · <b>allouer</b> : distribue les ressources financières, humaines, technologiques vers les objectifs · <b>arbitrer</b> : mène les négociations critiques, en interne (salariés) comme en externe (parties prenantes)</td></tr>
</tbody></table></div>
<div class="tip">Pour les informationnels, suis le trajet de l’information : elle <b>entre</b> (observateur actif), elle <b>circule dans l’équipe</b> (diffuseur), elle <b>sort</b> (porte-parole).</div>
<div class="dia"><b>Précisions des diapositives.</b> Figure de proue : représentation cérémoniale de l’entreprise. Agent de liaison : construction d’un réseau informel mais redoutablement efficace. Leader : recrute, dirige et encourage l’équipe. Observateur actif : en quête constante de signaux internes et externes. Diffuseur et porte-parole : répartit les données critiques aux acteurs et transmet la posture vers l’extérieur. Total : 3 + 3 + 4 = <b>10 rôles</b>.</div>
<div class="exam"><b>Devoir 2024 :</b> « Quels sont les rôles informationnels d’un manager ? » → observateur actif, diffuseur d’information, porte-parole.</div>
<div data-lab="rappel"><p>Cite les trois rôles informationnels.</p>
<ul><li>Observateur actif|observat</li><li>Diffuseur d’information|diffus</li><li>Porte-parole|porte</li></ul>
<div class="sol">Observateur actif, diffuseur d’information, porte-parole.</div></div>
<div data-lab="rappel"><p>Cite les trois rôles interpersonnels.</p>
<ul><li>Figure de proue|proue|figure</li><li>Leader|leader</li><li>Agent de liaison|liaison</li></ul>
<div class="sol">Figure de proue, leader, agent de liaison.</div></div>
<div data-lab="rappel"><p>Cite les quatre rôles décisionnels.</p>
<ul><li>Entrepreneur|entrepren</li><li>Régulateur|regulat</li><li>Répartiteur de ressources|repartit</li><li>Négociateur|negoci</li></ul>
<div class="sol">Entrepreneur (initier), régulateur (corriger), répartiteur (allouer), négociateur (arbitrer). Le résumé n’en citait que deux ; les diapositives en donnent quatre.</div></div>
<div data-lab="relier"><p>Relie chaque rôle à sa famille.</p>
<dl><dt>Porte-parole</dt><dd>Informationnel</dd>
<dt>Agent de liaison</dt><dd>Interpersonnel</dd>
<dt>Régulateur</dt><dd>Décisionnel</dd>
<dt>Observateur actif</dt><dd>Informationnel</dd>
<dt>Figure de proue</dt><dd>Interpersonnel</dd>
<dt>Entrepreneur</dt><dd>Décisionnel</dd>
<dt>Négociateur</dt><dd>Décisionnel</dd></dl></div>
<div data-lab="choix" data-a="2"><p>Le manager annonce à la presse les résultats de son service. Il joue le rôle de :</p>
<ul><li>diffuseur d’information</li><li>observateur actif</li><li>porte-parole</li><li>régulateur</li></ul>
<div class="sol">L’information sort de l’équipe vers l’extérieur : porte-parole. Le diffuseur transmet à l’intérieur de l’équipe.</div></div>` },

{ id: '3.3', t: 'Le leadership', h: `
<div class="def">Le <b>leadership</b> définit la <b>capacité d’un individu à mener ou conduire</b> d’autres individus ou organisations <b>dans le but d’atteindre certains objectifs</b>.</div>
<div class="dia"><b>Définition des diapositives</b> : le leadership est la capacité d’<b>influencer</b> et de <b>fédérer</b> un groupe vers un <b>objectif commun</b>, cimenté par une relation de <b>confiance mutuelle</b> (pour une durée limitée). Le leader doit <b>obtenir les moyens d’action</b> (sécuriser les budgets, les humains, les normes, simplifier les procédures) puis <b>répartir et déléguer</b> : fixer des objectifs avec une marge de manœuvre. <b>Déléguer n’est pas abandonner</b> : c’est responsabiliser, puis contrôler.</div>
<p>Le leader est l’un des trois rôles <b>interpersonnels</b> : c’est le rôle par lequel le manager entraîne son équipe.</p>
<div data-lab="rappel"><p>Complète : « Le leadership est la … d’un individu à … ou conduire d’autres individus ou organisations dans le but d’atteindre certains … »</p>
<ul><li>capacité|capacit</li><li>mener|mener</li><li>objectifs|objectif</li></ul>
<div class="sol">Capacité · mener · objectifs.</div></div>` },

{ id: '3.4', t: 'Les tâches du manager et les niveaux hiérarchiques', h: `
<div class="dia"><b>Les tâches fondamentales du manager</b> (huit verbes) : <b>piloter</b>, <b>performer</b>, <b>résoudre</b>, <b>communiquer</b>, <b>anticiper</b>, <b>décider</b>, <b>organiser</b>, <b>animer</b>.</div>
<div class="tw"><table>
<thead><tr><th>Niveau (topologie hiérarchique)</th><th>Rôle</th><th>Compétences nécessaires</th></tr></thead>
<tbody>
<tr><th>Hauts managers · <b>cadres dirigeants</b></th><td>stratégie et politique : responsables des décisions globales, établissent les politiques de toute l’organisation</td><td><b>conceptuelles</b></td></tr>
<tr><th>Managers · <b>cadres intermédiaires</b></th><td>coordination et direction : le cœur du réseau ; associent les individus aux objectifs, en mode hiérarchique ou transversal ; gouvernent les activités</td><td><b>humaines et interculturelles</b></td></tr>
<tr><th>Employés opérationnels · <b>cadres fonctionnels ou opérationnels</b></th><td>exécution : occupés par une tâche donnée, sans responsabilité de supervision ; exécutent mais ne dirigent pas</td><td><b>techniques</b></td></tr>
</tbody></table></div>
<div class="tip">Plus on monte, plus on a besoin de <b>concepts</b> ; plus on descend, plus on a besoin de <b>technique</b> ; au milieu, de l’<b>humain</b>.</div>
<div data-lab="rappel"><p>Cite les huit tâches fondamentales du manager.</p>
<ul><li>Piloter|pilot</li><li>Performer|perform</li><li>Résoudre|resoud|resol</li><li>Communiquer|communi</li><li>Anticiper|anticip</li><li>Décider|decid</li><li>Organiser|organis</li><li>Animer|anim</li></ul>
<div class="sol">Piloter, performer, résoudre, communiquer, anticiper, décider, organiser, animer.</div></div>
<div data-lab="relier"><p>Relie chaque niveau aux compétences dont il a surtout besoin.</p>
<dl><dt>Cadres dirigeants</dt><dd>Compétences conceptuelles</dd>
<dt>Cadres intermédiaires</dt><dd>Compétences humaines et interculturelles</dd>
<dt>Cadres opérationnels</dt><dd>Compétences techniques</dd></dl></div>` },

{ id: '3.5', t: 'Manager ou leader : la matrice de Drucker', h: `
<div class="tw"><table>
<thead><tr><th></th><th>MANAGER (le cadre)</th><th>LEADER (la vision)</th></tr></thead>
<tbody>
<tr><th>Focus principal</th><td>exécution et contrôle</td><td>vision et influence</td></tr>
<tr><th>Méthodologie</th><td>faire <b>correctement</b> les choses (organisation)</td><td>faire les <b>bonnes</b> choses (direction)</td></tr>
<tr><th>Dynamique d’équipe</th><td>répartition précise des tâches</td><td>fédérer par la confiance mutuelle</td></tr>
</tbody></table></div>
<div class="dia">« <i>Managers do the things right. Leaders do the right things.</i> » — Peter Drucker.</div>
<div data-lab="relier"><p>Manager ou leader ?</p>
<dl><dt>Faire correctement les choses</dt><dd>Manager</dd>
<dt>Faire les bonnes choses</dt><dd>Leader</dd>
<dt>Exécution et contrôle</dt><dd>Manager</dd>
<dt>Fédérer par la confiance mutuelle</dt><dd>Leader</dd></dl></div>` },

{ id: '3.6', t: 'Le manager moderne', h: `
<div class="tw"><table>
<thead><tr><th>Profil</th><th>Ce que disent les diapositives</th></tr></thead>
<tbody>
<tr><th><b>Innovant</b> (construire la vision)</th><td>multi-compétent (vision panoptique et systémique) ; interfaces (innove aux carrefours de plusieurs métiers) ; réseau (le mobilise pour pallier les déficits de compétences)</td></tr>
<tr><th><b>Agile</b> (libérer l’énergie)</th><td>manager dans le chaos (gérer l’incertitude, accepter l’imperfection) ; intelligence relationnelle (prend le pas sur les compétences purement techniques) ; décision décentralisée (au bon niveau opérationnel, alliant bienveillance et exigence)</td></tr>
<tr><th><b>Digital</b> (boosté au digital)</th><td>horizon numérique : outils collaboratifs web et cloud pour le travail à distance ; ère de l’IA : équipes mixtes hommes-robots (aide à la décision, reporting)</td></tr>
<tr><th><b>Global</b> (ouvert sur le monde)</th><td>pilotage d’équipes multiculturelles, maîtrise polyglotte ; « distance zéro » : gérer l’humain à des milliers de kilomètres avec la même efficacité qu’en présentiel</td></tr>
</tbody></table></div>
<div class="dia"><b>La complexité interculturelle</b> : ne pas supprimer les différences, mais les utiliser comme une <b>richesse</b>. Quatre axes : rapport à la <b>hiérarchie</b> (décision unilatérale « top-down » ↔ décision impliquée « bottom-up ») ; rapport au <b>collectif</b> (travail individuel ↔ primauté du groupe) ; gestion des <b>conflits</b> (confrontation directe ↔ recherche d’harmonie informelle) ; gestion du <b>temps</b> (planification stricte ↔ flexibilité). Compétences du manager : <b>écoute, ouverture d’esprit, adaptation, compréhension des codes</b>.</div>
<div class="dia"><b>Le bilan humain / IA</b> : l’automatisation libère le manager des tâches administratives pour le <b>recentrer sur l’humain</b>. À l’IA : automatiser les tâches répétitives, analyser d’immenses volumes de données (ex. pharmacie : prévision des ventes, optimisation des stocks, analyse de la recherche) ; enjeux : biais algorithmiques, confidentialité, protection des données. Au manager : la décision complexe avec <b>responsabilité éthique</b> ; valeur ajoutée : leadership, créativité, négociation, accompagnement humain.</div>
<div class="dia"><b>Le « Manager Stack », synthèse du rôle</b> (de la base au sommet) : <b>fondation</b> = le coordinateur (interface, moyens techniques, financiers, humains) ; <b>système</b> = les 10 rôles de Mintzberg ; <b>cœur</b> = le leader de Drucker (influence, vision, faire les bonnes choses) ; <b>enveloppe</b> = les 4 profils modernes (innovant, agile, digital, global).</div>
<div data-lab="rappel"><p>Cite les quatre profils du manager moderne.</p>
<ul><li>Innovant|innov</li><li>Agile|agil</li><li>Digital|digit|numeri</li><li>Global|global|monde</li></ul>
<div class="sol">Innovant, agile, digital, global.</div></div>
<div data-lab="rappel"><p>Cite les quatre axes de la complexité interculturelle.</p>
<ul><li>Rapport à la hiérarchie|hierarch</li><li>Rapport au collectif|collectif|groupe</li><li>Gestion des conflits|conflit</li><li>Gestion du temps|temps</li></ul>
<div class="sol">Hiérarchie, collectif, conflits, temps.</div></div>` }
],

sections: [
{ id: '4.1', t: 'Définition et éléments', h: `
<div class="dia"><b>L’entreprise est un lieu de prises de décisions</b> : chaque entreprise oriente son activité par de <b>multiples décisions d’inégale importance</b> afin d’atteindre les objectifs fixés. <b>Décider</b>, c’est <b>choisir entre deux ou plusieurs options</b>.</div>
<div class="def">La <b>décision</b> répond à l’apparition d’un <b>problème</b>, c’est-à-dire une <b>divergence</b> entre un <b>état de choses actuel</b> et un <b>état de choses souhaité</b>, qui impose d’envisager une <b>ligne de conduite alternative</b>.</div>
<div class="exam"><b>Phrase à trous du devoir 2024 :</b> « La décision répond à l’apparition <b>d’un problème</b>. C’est une divergence entre un état <b>actuel</b> et un état <b>souhaité</b>. » La copie du dossier a écrit « de changement » et « de départ / d’arrivée » : ce sont les mots du chapitre sur le changement, pas ceux de la décision.</div>
<div data-lab="rappel"><p>Complète : « La décision répond à l’apparition d’un … C’est une divergence entre un état … et un état … »</p>
<ul><li>problème|problem</li><li>actuel|actuel</li><li>souhaité|souhait</li></ul>
<div class="sol">Problème · actuel · souhaité.</div></div>
<div class="dia">Schéma du cours : <b>état actuel</b> (le problème) → <b>la décision</b> (un processus d’engagement progressif, un choix parmi plusieurs options) → <b>état souhaité</b> (la résolution : mesures favorisant la création de richesse et apportant une solution satisfaisante).<br>Trois caractéristiques : la décision n’est <b>pas un acte unique</b> (un ensemble successif de décisions de moindre portée) ; elle est <b>multi-variables</b> (un nombre massif de variables au-delà du simple profit) ; son <b>contexte est aléatoire</b> (plusieurs chemins peuvent mener au même objectif).</div>
<h4>Les six éléments du processus décisionnel</h4>
<ol><li>le <b>décideur</b> : il a le <b>pouvoir</b> de prendre la décision ;</li><li>les <b>objectifs</b> et la <b>motivation</b> ;</li><li>les <b>données</b> et les <b>informations</b> : toute décision est précédée d’une collecte et d’une analyse d’informations suffisantes sur le problème ;</li><li>la <b>prévision</b> : un pilier essentiel, car chaque décision a des effets futurs, positifs ou négatifs, qui doivent être prédits ;</li><li>les <b>alternatives</b> ;</li><li>le <b>climat</b> dans lequel la décision est prise.</li></ol>
<div class="tip">Une phrase pour les retenir : un <b>décideur</b>, qui a des <b>objectifs</b>, réunit des <b>informations</b>, fait des <b>prévisions</b>, compare des <b>alternatives</b>, dans un certain <b>climat</b>.</div>
<div data-lab="rappel"><p>Cite les six éléments du processus décisionnel.</p>
<ul><li>Le décideur|decideur</li><li>Objectifs et motivation|objectif|motivation</li><li>Données et informations|donnee|information</li><li>La prévision|prevision</li><li>Les alternatives|alternative</li><li>Le climat|climat</li></ul>
<div class="sol">Décideur, objectifs et motivation, données et informations, prévision, alternatives, climat.</div></div>` },

{ id: '4.2', t: 'Les trois types de décisions', h: `
<div class="tw"><table>
<thead><tr><th>Type</th><th>Ce qu’en dit le cours</th><th>Exemple</th></tr></thead>
<tbody>
<tr><th><b>Stratégiques</b></th><td><b>engagent l’avenir</b> de l’entreprise en choisissant les objectifs de <b>politique générale</b>, les activités, les marchés, les manœuvres et les armes stratégiques</td><td>lancer une nouvelle activité, racheter un concurrent</td></tr>
<tr><th><b>Administratives</b></th><td>concernent la <b>structure</b> de l’entreprise, l’<b>organisation</b>, l’<b>acquisition et le développement de ses ressources</b></td><td>créer un service, recruter, acheter des machines</td></tr>
<tr><th><b>Opérationnelles</b></th><td>plus <b>fréquentes</b>, plus <b>répétitives</b> et <b>moins risquées</b>, car leurs implications sont plus <b>localisées</b></td><td>passer une commande, établir le planning du jour</td></tr>
</tbody></table></div>
<div class="exam"><b>Devoir 2024 :</b> « Qui prend les décisions stratégiques et pour quelles raisons ? »<br><b>Réponse modèle :</b> la <b>direction générale</b>, parce que ces décisions <b>engagent l’avenir de l’entreprise</b> : elles fixent les objectifs de politique générale, les activités et les marchés, pour assurer sa survie et son développement. La copie a eu le point avec « le directeur, pour fixer les grandes orientations et la politique d’ensemble ».</div>
<div class="dia"><b>La pyramide d’Ansoff</b> (importance croissante vers le haut) et ses caractéristiques :</div>
<div class="tw"><table>
<thead><tr><th>Caractéristique</th><th>Stratégique</th><th>Administrative</th><th>Opérationnelle</th></tr></thead>
<tbody>
<tr><th>Horizon de temps</th><td>long terme</td><td>court terme</td><td>très court terme</td></tr>
<tr><th>Réversibilité</th><td>nulle</td><td>faible</td><td>forte</td></tr>
<tr><th>Répétitivité</th><td>nulle</td><td>faible</td><td>forte</td></tr>
<tr><th>Niveau de décision</th><td>direction générale</td><td>directions fonctionnelles</td><td>chefs de services et ateliers</td></tr>
<tr><th>Nature des informations</th><td>incertaines et exogènes</td><td>presque complètes et endogènes</td><td>complètes et endogènes</td></tr>
<tr><th>Procédure</th><td>non programmable</td><td>semi-programmable</td><td>programmable</td></tr>
</tbody></table></div>
<p>Les décisions opérationnelles <b>rendent opérationnelles les options stratégiques</b> (prix, plannings).</p>
<div data-lab="relier"><p>Relie chaque caractéristique au type de décision.</p>
<dl><dt>Non programmable, informations incertaines et exogènes</dt><dd>Stratégique</dd>
<dt>Semi-programmable, directions fonctionnelles</dt><dd>Administrative</dd>
<dt>Programmable, réversibilité forte</dt><dd>Opérationnelle</dd></dl></div>
<div class="dia"><b>Les facteurs qui influencent les décisions</b> : le <b>style de direction</b> ; l’<b>histoire</b> de l’entreprise ; sa <b>culture</b> ; son <b>mode de gouvernance</b> ; la <b>nature</b> de la décision ; le <b>niveau de rationalité</b> de la décision.</div>
<div data-lab="rappel"><p>Cite les six facteurs qui influencent les décisions.</p>
<ul><li>Le style de direction|style</li><li>L’histoire de l’entreprise|histoire</li><li>Sa culture|culture</li><li>Son mode de gouvernance|gouvernance</li><li>La nature de la décision|nature</li><li>Le niveau de rationalité|rationalit</li></ul>
<div class="sol">Style de direction, histoire, culture, mode de gouvernance, nature de la décision, niveau de rationalité.</div></div>
<div data-lab="relier"><p>Relie chaque décision à son type.</p>
<dl><dt>Entrer sur le marché africain</dt><dd>Stratégique</dd>
<dt>Créer une direction de la qualité</dt><dd>Administrative</dd>
<dt>Réapprovisionner le stock de vis</dt><dd>Opérationnelle</dd>
<dt>Recruter vingt ingénieurs</dt><dd>Administrative</dd>
<dt>Abandonner une gamme de produits</dt><dd>Stratégique</dd></dl></div>
<div data-lab="choix" data-a="0,1,3"><p>Les décisions opérationnelles sont, par rapport aux autres :</p>
<ul><li>plus fréquentes</li><li>plus répétitives</li><li>plus risquées</li><li>plus localisées dans leurs implications</li></ul>
<div class="sol">Fréquentes, répétitives, moins risquées, localisées.</div></div>` },

{ id: '4.3', t: 'Le processus de décision : cinq phases', h: `
<div class="tw"><table>
<thead><tr><th>N°</th><th>Phase</th><th>Ce qu’on y fait</th></tr></thead>
<tbody>
<tr><td>1</td><th><b>Intelligence</b></th><td>perception et <b>compréhension</b> du problème</td></tr>
<tr><td>2</td><th><b>Modélisation</b> ou <b>conception</b></th><td>on conçoit et on formule <b>toutes les voies possibles</b> de résolution</td></tr>
<tr><td>3</td><th><b>Choix</b></th><td>on <b>sélectionne une solution</b> en fonction des objectifs fixés</td></tr>
<tr><td>4</td><th><b>Décision</b></th><td>on <b>mobilise les moyens</b> physiques et financiers pour mettre en œuvre l’alternative retenue</td></tr>
<tr><td>5</td><th><b>Contrôle</b></th><td>on <b>compare les résultats obtenus à ceux anticipés</b></td></tr>
</tbody></table></div>
<div class="dia">Ce processus est le <b>cycle itératif de Simon (modèle IMCE)</b> : la décision n’est pas un acte isolé, mais un <b>processus systémique et itératif</b> ; le <b>contrôle</b> (vérification a posteriori et mesure des écarts) <b>relance la boucle</b>.</div>
<div class="tip"><b>I-M-C-D-C</b> : je <b>comprends</b>, j’<b>imagine</b> les solutions, j’en <b>choisis</b> une, je la <b>mets en œuvre</b>, je <b>vérifie</b>.</div>
<div class="warn">Dans ce cours, « décision » désigne la <b>mise en œuvre</b>, et elle vient <b>après</b> le choix. Devoir 2024 : « l’étape de décision fait suite à l’étape de <b>choix</b> ».</div>
<div data-lab="ordre"><p>Remets les cinq phases dans l’ordre.</p>
<ol><li>Intelligence</li><li>Modélisation (conception)</li><li>Choix</li><li>Décision</li><li>Contrôle</li></ol>
<div class="sol">Intelligence, modélisation, choix, décision, contrôle.</div></div>
<div data-lab="relier"><p>Relie chaque phase à ce qu’on y fait.</p>
<dl><dt>Intelligence</dt><dd>Percevoir et comprendre le problème</dd>
<dt>Modélisation</dt><dd>Formuler toutes les voies possibles</dd>
<dt>Choix</dt><dd>Sélectionner une solution</dd>
<dt>Décision</dt><dd>Mobiliser les moyens pour la mise en œuvre</dd>
<dt>Contrôle</dt><dd>Comparer les résultats obtenus à ceux anticipés</dd></dl></div>` },

{ id: '4.4', t: 'Incertitude et environnements', h: `
<h4>Les quatre situations, par incertitude croissante</h4>
<p>Le cours donne les quatre noms dans cet ordre. La deuxième colonne est un complément, confirmé pour l’avenir aléatoire par le devoir.</p>
<div class="tw"><table>
<thead><tr><th>Situation</th><th>Ce que sait le décideur</th></tr></thead>
<tbody>
<tr><th>Avenir <b>certain</b></th><td>il connaît le résultat de chaque alternative</td></tr>
<tr><th>Avenir <b>aléatoire</b></th><td>il connaît les <b>probabilités</b> de chaque alternative</td></tr>
<tr><th>Avenir <b>incertain</b></th><td>il connaît les résultats possibles, mais <b>pas leurs probabilités</b></td></tr>
<tr><th>Situation <b>conflictuelle</b></th><td>le résultat dépend des décisions d’un <b>adversaire</b> (concurrent)</td></tr>
</tbody></table></div>
<div class="exam"><b>Devoir 2024 :</b> « Quelle décision prend le décideur lorsqu’il connaît les probabilités de chaque alternative ? » → une décision en <b>avenir aléatoire</b>.</div>
<div data-lab="ordre"><p>Classe les quatre situations par niveau d’incertitude croissant.</p>
<ol><li>Avenir certain</li><li>Avenir aléatoire</li><li>Avenir incertain</li><li>Situation conflictuelle</li></ol>
<div class="sol">Certain, aléatoire, incertain, conflictuelle.</div></div>
<div data-lab="choix" data-a="2"><p>Le décideur connaît les résultats possibles mais ne peut pas leur attribuer de probabilités. Il est en avenir :</p>
<ul><li>certain</li><li>aléatoire</li><li>incertain</li></ul>
<div class="sol">Probabilités connues : aléatoire. Probabilités inconnues : incertain.</div></div>
<div class="dia"><b>Les outils d’aide à la décision</b> sont les instruments que le manager utilise pour une décision <b>non programmable</b> ; leur choix dépend du problème, de ses paramètres et des éventualités associées. On les classe selon le niveau d’incertitude :</div>
<div class="tw"><table>
<thead><tr><th>Situation</th><th>Ce que dit la diapositive</th><th>Outils</th></tr></thead>
<tbody>
<tr><th>Avenir certain</th><td>conséquences prévisibles</td><td>programmation linéaire, modèles de stocks, actualisation, analyse de la valeur</td></tr>
<tr><th>Avenir aléatoire</th><td>éventualités connues avec probabilités</td><td>espérance mathématique, arbres de choix</td></tr>
<tr><th>Avenir incertain</th><td>impossibilité d’attribuer des probabilités</td><td>résolution minimale (pessimiste, prudent) ou maximale (optimiste)</td></tr>
<tr><th>Avenir conflictuel</th><td>comportements stratégiques et concurrence</td><td>théorie des jeux</td></tr>
</tbody></table></div>
<div data-lab="relier"><p>Relie chaque situation à son outil.</p>
<dl><dt>Avenir certain</dt><dd>Programmation linéaire</dd>
<dt>Avenir aléatoire</dt><dd>Espérance mathématique, arbres de choix</dd>
<dt>Avenir incertain</dt><dd>Critère pessimiste ou optimiste</dd>
<dt>Avenir conflictuel</dt><dd>Théorie des jeux</dd></dl></div>
<h4>La modélisation de la décision : quatre environnements</h4>
<p>Le cours cite un modèle à quatre types d’environnement : <b>simple</b>, <b>compliqué</b>, <b>complexe</b>, <b>chaotique</b>.</p>
<div class="tw"><table>
<thead><tr><th>Environnement</th><th>Ce que disent les diapositives</th></tr></thead>
<tbody>
<tr><th>1 · Simple</th><td>contexte stable, changements prévisibles, faits clairs, méthodes structurantes</td></tr>
<tr><th>2 · Compliqué</th><td>liens embrouillés, relations causes-effets peu perceptibles ; but : simplifier pour ramener au modèle simple</td></tr>
<tr><th>3 · Complexe</th><td>liaisons multiples (interconnexions), pas de réponse unique ; nécessite coopération et structures horizontales</td></tr>
<tr><th>4 · Chaotique</th><td>instabilité, changements rapides, incertitudes, relations causes-effets imperceptibles</td></tr>
</tbody></table></div>
<div data-lab="rappel"><p>Cite les quatre types d’environnement du modèle.</p>
<ul><li>Simple|simple</li><li>Compliqué|compliqu</li><li>Complexe|complexe</li><li>Chaotique|chaoti</li></ul>
<div class="sol">Simple, compliqué, complexe, chaotique.</div></div>` },

{ id: '4.5', t: 'Rationalité et intuition', h: `
<div class="dia"><b>Coupe-circuit : quand faire appel à l’intuition ?</b>
<ol type="a"><li>quand le niveau d’incertitude est particulièrement élevé ;</li><li>quand il existe trop peu de précédents auxquels se raccrocher ;</li><li>quand les variables n’offrent pas une prédictibilité scientifique suffisante ;</li><li>quand les « faits » manquent ;</li><li>quand les « faits » n’indiquent pas clairement la direction à prendre ;</li><li>quand les données analytiques présentent peu d’intérêt ;</li><li>quand plusieurs solutions plausibles sont envisageables et se valent toutes ;</li><li>quand le temps presse et qu’il devient urgent de prendre la bonne décision.</li></ol></div>
<div class="dia"><b>La matrice de synthèse : l’alignement stratégique</b> (type de décision × état de l’environnement).
<ul><li><b>Zone optima</b> = opérationnelle + certain : la <b>rationalité classique</b> fonctionne ; outil : programmation linéaire.</li>
<li><b>Frontière intuitive</b> = stratégique + chaotique : la <b>rationalité limitée</b> domine ; forte dépendance à l’<b>intuition</b>.</li></ul>
À mesure qu’un manager s’élève dans la pyramide d’Ansoff, l’environnement devient plus complexe : la rationalité classique cède la place à la rationalité limitée et à l’intuition.</div>
<div data-lab="choix" data-a="0,1,3"><p>Dans quelles situations l’intuition est-elle justifiée ?</p>
<ul><li>peu de précédents auxquels se raccrocher</li><li>le temps presse</li><li>toutes les données sont disponibles et fiables</li><li>plusieurs solutions plausibles se valent</li></ul>
<div class="sol">Avec des données complètes et fiables, on reste dans la rationalité classique.</div></div>
<div data-lab="choix" data-a="2"><p>Une décision opérationnelle en avenir certain se situe dans :</p>
<ul><li>la frontière intuitive</li><li>la zone de rationalité limitée</li><li>la zone optima, où la rationalité classique fonctionne</li></ul>
<div class="sol">Opérationnelle + certain = zone optima.</div></div>` }
],

{ id: '5.1', t: 'Définition, types, ce que le changement touche', h: `
<div class="def">Le <b>changement</b> est un <b>processus de transformation radicale ou marginale</b> des <b>structures</b> et des <b>compétences</b>, qui ponctue le processus d’évolution des organisations.<br>Tout changement est un <b>processus</b> : entre l’<b>état de départ</b> et l’<b>état d’arrivée</b>, il y a un <b>chemin à parcourir</b>.</div>
<div class="dia"><b>Version des diapositives</b> : un processus de transformation des <b>structures</b>, des <b>modes de gestion</b> et des <b>compétences</b>. Un véritable changement exige l’<b>apprentissage inconscient de nouveaux gestes mentaux</b> et génère inéluctablement du <b>stress</b>.<br>Schéma : <b>état A (départ)</b> → <b>décongélation</b> → <b>zone d’incertitude</b> → <b>recongélation</b> → <b>état B (arrivée)</b>.</div>
<div class="tw"><table>
<thead><tr><th>Vitesse ↓ / Origine →</th><th>Subi / spontané</th><th>Provoqué / planifié</th></tr></thead>
<tbody>
<tr><th>Radical</th><td>changement <b>subi</b> (réactif)</td><td>changement <b>provoqué</b> (proactif)</td></tr>
<tr><th>Marginal / apprentissage</th><td>changement <b>radical</b> (rupture)</td><td>changement <b>marginal / apprentissage</b> (évolution)</td></tr>
</tbody></table></div>
<p><small>Matrice recopiée telle qu’elle apparaît sur la diapositive (deux axes : l’origine et la vitesse ou intensité).</small></p>
<div class="warn">Ne mélange pas : le <b>changement</b> va d’un état de <b>départ</b> à un état d’<b>arrivée</b> ; la <b>décision</b> naît d’un écart entre un état <b>actuel</b> et un état <b>souhaité</b>.</div>
<h4>Les types de changement</h4>
<ul>
<li>le changement <b>provoqué</b> (voulu par l’entreprise) et le changement <b>subi</b> (imposé de l’extérieur) ;</li>
<li>le changement <b>radical</b> (une rupture) ;</li>
<li>le changement <b>planifié</b> (préparé) et le changement <b>spontané</b> (non prévu) ;</li>
<li>l’<b>apprentissage</b> et l’<b>évolution</b> (progressifs).</li>
</ul>
<p><small>Les explications entre parenthèses sont un complément ; le cours ne donne que les noms.</small></p>
<h4>Ce que le changement touche dans l’entreprise</h4>
<ul><li>l’<b>organisation du travail</b> ;</li><li>la <b>responsabilité et la délégation</b> du personnel ;</li><li>la <b>structure</b> de l’entreprise ;</li><li>le <b>cadre technologique</b>.</li></ul>
<div data-lab="rappel"><p>Complète : « Le changement est un processus de … radicale ou marginale des … et des … »</p>
<ul><li>transformation|transform</li><li>structures|structure</li><li>compétences|competence</li></ul>
<div class="sol">Transformation · structures · compétences.</div></div>
<div data-lab="rappel"><p>Cite les quatre choses que le changement touche généralement dans l’entreprise.</p>
<ul><li>L’organisation du travail|organisation|travail</li><li>Responsabilité et délégation du personnel|responsab|delegation</li><li>La structure de l’entreprise|structure</li><li>Le cadre technologique|technolog</li></ul>
<div class="sol">Organisation du travail, responsabilité et délégation, structure, cadre technologique.</div></div>
<div data-lab="choix" data-a="1"><p>Une nouvelle loi oblige l’entreprise à modifier ses emballages. C’est un changement :</p>
<ul><li>provoqué</li><li>subi</li></ul>
<div class="sol">Il est imposé par l’environnement, l’entreprise ne l’a pas voulu.</div></div>` },

{ id: '5.2', t: 'Les quatre réactions au changement', h: `
<p>Les personnes passent par quatre réactions, dans cet ordre. Le cours donne les noms ; la description aide à les reconnaître dans une phrase.</p>
<div class="tw"><table>
<thead><tr><th>N°</th><th>Réaction</th><th>Ce que fait la personne</th></tr></thead>
<tbody>
<tr><td>1</td><th><b>Dénégation</b></th><td>elle fait comme si le changement n’existait pas, ou ne la concernait pas</td></tr>
<tr><td>2</td><th><b>Résistance</b></th><td>elle s’oppose, se plaint, doute, regrette l’ancienne façon de faire</td></tr>
<tr><td>3</td><th><b>Exploration</b></th><td>elle <b>cherche les éléments positifs</b> du changement et des <b>moyens d’aider son implantation</b></td></tr>
<tr><td>4</td><th><b>Engagement</b></th><td>elle adhère et s’investit dans la nouvelle façon de faire</td></tr>
</tbody></table></div>
<div class="exam"><b>Phrase à trous du devoir 2024 :</b> « Quand vous cherchez à trouver les éléments positifs du changement et à trouver des moyens visant à aider l’implantation du changement, alors vous êtes en réaction de <b>…</b> avec ce changement. » La copie a écrit « résistance » : faux. La réponse est <b>exploration</b> : c’est mot pour mot la définition de la diapositive.</div>
<div class="dia"><b>Les quatre réactions selon les diapositives.</b>
<ul><li><b>Dénégation</b> : vous travaillez comme si rien n’avait changé, vous refusez de faire face au changement ; le nier longtemps empêche de faire face à vos émotions.</li>
<li><b>Résistance</b> : vous ne ciblez que les forces négatives ; colère, frustration, refus d’agir, dépression, inaction ou sabotage ; besoin de temps, d’attention et de communication pour dire adieu à l’ancien.</li>
<li><b>Exploration</b> : vous examinez le futur avec précaution, cherchez les <b>éléments positifs</b> et des <b>moyens d’aider l’implantation</b> ; vous restez ouvert à l’idée de vous engager.</li>
<li><b>Engagement</b> : vous mettez toute votre énergie à réussir l’implantation ; souvent vous devenez <b>porte-parole du changement</b> et aidez les autres.</li></ul></div>
<div class="dia"><b>La courbe du changement</b> (moral et productivité dans le temps) : <b>choc</b> → <b>déni</b> → <b>colère</b> → <b>négociation</b> → <b>dépression</b> (le creux) → <b>acceptation</b> → <b>expérimentation</b> → <b>décision</b> → <b>intégration</b>.</div>
<div data-lab="ordre"><p>Remets les étapes de la courbe du changement dans l’ordre.</p>
<ol><li>Choc</li><li>Déni</li><li>Colère</li><li>Négociation</li><li>Dépression</li><li>Acceptation</li><li>Expérimentation</li><li>Décision</li><li>Intégration</li></ol>
<div class="sol">Le moral descend jusqu’à la dépression, puis remonte avec l’acceptation.</div></div>
<div data-lab="ordre"><p>Remets les quatre réactions dans l’ordre.</p>
<ol><li>Dénégation</li><li>Résistance</li><li>Exploration</li><li>Engagement</li></ol>
<div class="sol">Dénégation, résistance, exploration, engagement.</div></div>
<div data-lab="relier"><p>Relie chaque phrase à la réaction.</p>
<dl><dt>« Ce nouveau logiciel, on n’en entendra plus parler dans un mois. »</dt><dd>Dénégation</dd>
<dt>« C’était mieux avant, je refuse de m’en servir. »</dt><dd>Résistance</dd>
<dt>« Voyons ce qu’il peut nous apporter et comment l’installer au mieux. »</dt><dd>Exploration</dd>
<dt>« Je l’utilise tous les jours et je forme mes collègues. »</dt><dd>Engagement</dd></dl></div>` },

{ id: '5.3', t: 'La résistance : ses raisons, comment la gérer', h: `
<h4>Les douze raisons du cours, en quatre paquets</h4>
<div class="tw"><table>
<thead><tr><th>Paquet</th><th>Raisons</th></tr></thead>
<tbody>
<tr><th>On ne <b>comprend</b> pas</th><td>mauvaise <b>compréhension du sens</b> du changement · mauvaise <b>communication</b> · absence de <b>consultation</b></td></tr>
<tr><th>On a <b>peur</b></th><td>peur de l’<b>inconnu</b> · manque de <b>compétences</b> · manque de <b>confiance</b></td></tr>
<tr><th>On est <b>attaché à l’ancien</b></th><td><b>relation personnelle</b> avec les anciennes manières de faire · rupture de la <b>routine</b> · changement du <b>statu quo</b></td></tr>
<tr><th>On n’y <b>croit</b> pas</th><td>conviction d’une <b>mode passagère</b> · <b>saturation</b> (trop de changements) · absence de <b>récompense</b></td></tr>
</tbody></table></div>
<div data-lab="rappel"><p>Cite au moins six raisons de la résistance au changement (il y en a douze).</p>
<ul><li>Mauvaise compréhension du sens du changement|comprehension|sens</li><li>La peur de l’inconnu|peur|inconnu</li><li>Le manque de compétences|competence</li><li>La relation personnelle avec les anciennes manières de faire|ancien|relation</li><li>Le manque de confiance|confiance</li><li>La conviction d’une mode passagère|mode|passag</li><li>L’absence de consultation|consult</li><li>Une mauvaise communication|communic</li><li>La rupture de la routine|routine</li><li>La saturation|saturation</li><li>Le changement de statu quo|statu</li><li>L’absence de récompense|recompens</li></ul>
<div class="sol">Compréhension, communication, consultation · inconnu, compétences, confiance · anciennes manières, routine, statu quo · mode passagère, saturation, récompense.</div></div>
<div class="dia"><b>Précisions des diapositives.</b> La <b>peur de l’inconnu</b> est la raison <b>la plus courante</b>. La <b>saturation</b> : ne pas prendre le fait de se conformer pour de l’acceptation, ni l’acceptation pour de l’engagement ; face à des changements incessants, les collaborateurs se résignent. Le <b>statu quo</b> : si l’on pense que le changement dégradera la situation ou fera perdre des avantages, il engendre ressentiment et manque d’engagement. L’<b>absence de consultation</b> : on résiste moins quand on participe (feedback, enquêtes). La <b>mauvaise communication</b> : mieux vaut communiquer un peu trop que pas assez. L’<b>absence de récompense</b> : les bénéfices ne paraissent pas aussi grands que les difficultés.</div>
<h4>Comment gérer la résistance ? (question 3 du devoir)</h4>
<div class="exam">La copie du dossier a obtenu le point avec quatre lignes : <b>constitution d’une équipe de changement</b> · <b>implication de la hiérarchie</b> · <b>la communication</b> · <b>la formation</b>.</div>
<div class="meth">Si tu oublies la liste, retourne les raisons : à chaque cause son remède.
<ul>
<li>on ne comprend pas → <b>communiquer</b> et expliquer le sens ; <b>consulter</b> et faire participer ;</li>
<li>on manque de compétences → <b>former</b> et accompagner ;</li>
<li>on manque de confiance → <b>impliquer la hiérarchie</b>, constituer une <b>équipe de changement</b> ;</li>
<li>on n’y croit pas → montrer des <b>résultats rapides</b>, <b>récompenser</b>.</li>
</ul></div>
<div data-lab="rappel"><p>Comment gérer la résistance au changement ? Donne quatre moyens.</p>
<ul><li>Constituer une équipe de changement|equipe|coalition</li><li>Impliquer la hiérarchie|hierarch|impli</li><li>Communiquer|communi</li><li>Former|form</li></ul>
<div class="sol">Équipe de changement, implication de la hiérarchie, communication, formation. Tu peux ajouter la consultation et la récompense.</div></div>` },

{ id: '5.4', t: 'Conduire le changement : Kotter', h: `
<div class="def">Le <b>modèle de Kotter</b> est un modèle de <b>conduite du changement</b> en <b>huit étapes</b>.</div>
<div class="tw"><table>
<thead><tr><th>N°</th><th>Étape</th><th>Idée</th></tr></thead>
<tbody>
<tr><td>1</td><th>Créer l’<b>urgence</b></th><td>faire sentir qu’il faut changer maintenant</td></tr>
<tr><td>2</td><th>Former une <b>coalition</b></th><td>réunir un groupe qui porte le changement</td></tr>
<tr><td>3</td><th>Développer une <b>vision</b></th><td>dire où l’on va</td></tr>
<tr><td>4</td><th><b>Communiquer</b> la vision</th><td>la faire connaître à tous</td></tr>
<tr><td>5</td><th>Inciter à l’<b>action</b></th><td>lever les obstacles</td></tr>
<tr><td>6</td><th>Démontrer des <b>résultats à court terme</b></th><td>des victoires rapides et visibles</td></tr>
<tr><td>7</td><th><b>Bâtir</b> sur les premiers résultats</th><td>continuer, ne pas crier victoire trop tôt</td></tr>
<tr><td>8</td><th><b>Ancrer</b> les nouvelles pratiques dans la <b>culture</b> de l’entreprise</th><td>rendre le changement durable</td></tr>
</tbody></table></div>
<div class="dia"><b>Les objectifs de chaque étape, d’après les diapositives.</b>
<ul><li><b>1. Créer l’urgence</b> : légitimer le changement et faciliter son déclenchement ; susciter l’engagement ; expliquer que ne pas changer fait courir des risques, preuves à l’appui (concurrence, environnement, <b>SWOT</b>) ; faire sortir les personnes de leur <b>zone de confort</b>.</li>
<li><b>2. Former une coalition</b> : une équipe du changement performante ; un vrai leadership pour rassembler (légitimité : position hiérarchique, expertise technique, communication, ancienneté) ; une influence dans différents domaines.</li>
<li><b>3. Développer une vision</b> : donner du <b>sens</b> pour motiver et rassurer ; une vision claire, sans ambiguïté, fondée sur des preuves, <b>partagée</b> avec les équipes.</li>
<li><b>4. Communiquer la vision</b> : maintenir le sentiment d’urgence ; convaincre ; dire où l’on va, pourquoi, et à quoi on échappe ; communiquer continuellement par différents moyens (mail, affichages).</li>
<li><b>7. Bâtir sur les premiers résultats</b> : prouver la capacité des managers (crédibilité) ; de petits objectifs à court terme pour éviter l’inertie ; entretenir la dynamique.</li>
<li><b>8. Ancrer dans la culture</b> : consolider ; intégrer l’état final dans la culture ; mettre à jour documents et supports (formation, procédures) ; vérifier l’efficacité (<b>PDCA</b>).</li></ul>
<small>Les étapes 5 et 6 ne figurent pas dans les photos.</small></div>
<div class="tip">Trois blocs : <b>préparer</b> (urgence, coalition, vision), <b>lancer</b> (communiquer, inciter à l’action, résultats rapides), <b>faire durer</b> (bâtir, ancrer).</div>
<div data-lab="ordre"><p>Remets les huit étapes de Kotter dans l’ordre.</p>
<ol><li>Créer l’urgence</li><li>Former une coalition</li><li>Développer une vision</li><li>Communiquer la vision</li><li>Inciter à l’action</li><li>Démontrer les résultats à court terme</li><li>Bâtir sur les premiers résultats</li><li>Ancrer les nouvelles pratiques dans la culture</li></ol>
<div class="sol">Urgence, coalition, vision, communiquer, action, résultats à court terme, bâtir, ancrer.</div></div>
<h4>Les pratiques déconseillées pendant la conduite du changement</h4>
<ul>
<li>ne pas fixer des <b>objectifs clairs</b> ;</li>
<li>fixer des objectifs <b>non réalisables</b> ;</li>
<li><b>changer d’objectifs</b> en cours de projet ;</li>
<li>ne pas respecter le <b>périmètre</b> du projet ;</li>
<li>ne pas avoir d’<b>indicateurs de suivi</b> ;</li>
<li>ne pas être vigilant au <b>style de management</b> utilisé.</li>
</ul>
<div class="tip">Trois portent sur les <b>objectifs</b> (flous, irréalisables, changeants), puis <b>périmètre</b>, <b>indicateurs</b>, <b>style</b>.</div>
<div class="dia"><b>Pourquoi, selon les diapositives</b> : objectifs pas clairs → sentiment de <b>flou</b>, moins de motivation ; irréalisables → <b>échec</b>, image des conducteurs détériorée, climat altéré ; changés en cours de route → personnes <b>désorientées</b>, nouveaux risques ; périmètre non respecté → gêne l’<b>anticipation</b> ; pas d’indicateurs → impossible de <b>suivre</b> et de détecter les problèmes ; style de management (directif, persuasif, délégatif, participatif) à adapter aux personnes et aux situations.</div>
<div data-lab="choix" data-a="0,2,3"><p>Lesquelles sont des pratiques déconseillées ?</p>
<ul><li>changer d’objectifs en cours de projet</li><li>démontrer des résultats à court terme</li><li>conduire le changement sans indicateurs de suivi</li><li>fixer des objectifs non réalisables</li><li>former une coalition</li></ul>
<div class="sol">Les deux autres sont des étapes de Kotter, donc recommandées.</div></div>` },

{ id: '5.5', t: 'Les sept étapes de la formulation et de la mise en œuvre', h: `

</tbody></table></div>
<div data-lab="ordre"><p>Remets les sept étapes dans l’ordre.</p>

<div class="sol">Prêts ? Pourquoi ? Où en sommes-nous ? Où aller ? Quoi changer ? Exécuter. Stabiliser.</div></div>` }

{ id: '6.1', t: 'La compétence et ses six éléments', h: `
<p>Le cours donne trois définitions. Retiens la deuxième, la plus courte, et la troisième, la plus complète.</p>
<div class="def">
1. La compétence réfère à des <b>attitudes</b>, des <b>traits de la personnalité</b> et des <b>connaissances</b>.<br>
2. La compétence est un <b>savoir agir face à des situations problèmes</b> tout en satisfaisant certains <b>critères de performance</b>.<br>
3. La compétence est l’ensemble des <b>connaissances, qualités, capacités, aptitudes</b> qui mettent en mesure de <b>discuter, consulter, décider</b> sur tout ce qui concerne son <b>métier</b>.</div>
<h4>Les six éléments de la compétence</h4>
<p>Le cours donne les six noms ; la deuxième colonne est un complément.</p>
<div class="tw"><table>
<thead><tr><th>Élément</th><th>En clair</th></tr></thead>
<tbody>
<tr><th>Le <b>savoir</b></th><td>les connaissances</td></tr>
<tr><th>Le <b>savoir-faire</b></th><td>la pratique, l’habileté</td></tr>
<tr><th>Le <b>savoir-être</b></th><td>le comportement, les attitudes</td></tr>
<tr><th>Le <b>savoir mobiliser</b></th><td>savoir combiner tout cela au bon moment</td></tr>
<tr><th>Le <b>vouloir mobiliser</b></th><td>la motivation</td></tr>
<tr><th>Le <b>pouvoir agir</b></th><td>avoir les moyens et le droit d’agir</td></tr>
</tbody></table></div>
<div class="tip">Trois <b>savoirs</b> (savoir, savoir-faire, savoir-être), puis <b>savoir</b>, <b>vouloir</b>, <b>pouvoir</b> : je sais mobiliser, je veux mobiliser, je peux agir.</div>
<h4>Les moyens d’acquisition</h4>
<ul><li>la <b>formation</b> ;</li><li>l’<b>expérience</b> professionnelle et extraprofessionnelle.</li></ul>
<div data-lab="rappel"><p>Cite les six éléments de la compétence.</p>

<div class="sol">Savoir, savoir-faire, savoir-être, savoir mobiliser, vouloir mobiliser, pouvoir agir.</div></div>
<div data-lab="relier"><p>Relie chaque situation à l’élément de la compétence.</p>
<dl><dt>Connaître les lois de l’électricité</dt><dd>Savoir</dd>
<dt>Câbler une armoire sans erreur</dt><dd>Savoir-faire</dd>
<dt>Rester calme et poli avec un client</dt><dd>Savoir-être</dd>
<dt>Être motivé pour utiliser ce qu’on sait</dt><dd>Vouloir mobiliser</dd>
<dt>Disposer de l’outillage et de l’autorisation</dt><dd>Pouvoir agir</dd></dl></div>
<div data-lab="rappel"><p>Cite les deux moyens d’acquisition de la compétence.</p>
<ul><li>La formation|formation</li><li>L’expérience professionnelle et extraprofessionnelle|experience</li></ul>
<div class="sol">Formation et expérience.</div></div>` },

{ id: '6.2', t: 'Compétences réelles et requises · le management des compétences', h: `
<div class="tw"><table>
<thead><tr><th></th><th>Définition du cours</th></tr></thead>
<tbody>
<tr><th>Compétences <b>réelles</b></th><td>celles que l’<b>individu possède réellement</b></td></tr>
<tr><th>Compétences <b>requises</b></th><td>celles <b>associées à un emploi</b>, que l’entreprise estime <b>indispensables</b>, à un certain niveau, pour la personne qui occupe le poste</td></tr>
</tbody></table></div>
<p>Réelles : côté <b>personne</b>. Requises : côté <b>poste</b>. Tout l’intérêt est de rapprocher les deux.</p>
<div class="def">Le <b>management des compétences</b> désigne un <b>mode de pilotage de l’organisation</b> qui fait des compétences et de leur développement un <b>vecteur majeur de la performance</b> et de la <b>création de valeur</b> en entreprise.</div>
<h4>À quoi sert-il ? Cinq réponses</h4>
<ul><li><b>développer</b> le capital humain ;</li><li><b>adapter</b> les compétences aux emplois ;</li><li><b>recruter</b> des profils pertinents ;</li><li><b>motiver</b> ses collaborateurs ;</li><li><b>fidéliser</b> les talents.</li></ul>
<div class="tip">Cinq verbes : <b>développer, adapter, recruter, motiver, fidéliser</b>.</div>
<div data-lab="choix" data-a="1"><p>« Le poste de chef de projet exige de savoir conduire une réunion en anglais. » C’est une compétence :</p>
<ul><li>réelle</li><li>requise</li></ul>
<div class="sol">Elle est attachée au poste, pas à une personne.</div></div>
<div data-lab="rappel"><p>À quoi sert le management des compétences ? Donne les cinq verbes.</p>
<ul><li>Développer le capital humain|develop|capital</li><li>Adapter les compétences aux emplois|adapt</li><li>Recruter des profils pertinents|recrut</li><li>Motiver ses collaborateurs|motiv</li><li>Fidéliser les talents|fidelis</li></ul>
<div class="sol">Développer, adapter, recruter, motiver, fidéliser.</div></div>` },
